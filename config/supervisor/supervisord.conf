[program:ws_cascade]
; WATCHTOWER real-time websocket cascade. STANDALONE daemon — owns one Helius WS
; connection + the subscribe/teardown loop. Triggered by sessions the webhook writes
; into wt_active_subprov_sessions (DB is the handoff boundary; no shared connections
; with the API/webhook process → no lock-storm risk). autostart=false; start explicitly.
command=/Users/kevinkeaveney/anaconda3/envs/algotrader/bin/python
    -m src.core.ws_cascade --loop
directory=/Users/kevinkeaveney/Dev/claude/flex
environment=
    PYTHONPATH="/Users/kevinkeaveney/Dev/claude/flex",
    DB_PATH="/Users/kevinkeaveney/Dev/claude/flex/database/flex_complete_database.db",
    HELIUS_API_KEY="16f1a5fc-2592-466c-a5d4-b5799ae8da96",
    HELIUS_RPC_URL="https://mainnet.helius-rpc.com/?api-key=16f1a5fc-2592-466c-a5d4-b5799ae8da96",
    HELIUS_WS_URL="wss://mainnet.helius-rpc.com/?api-key=16f1a5fc-2592-466c-a5d4-b5799ae8da96",
    WS_SESSION_TTL_SEC="1800",
    WS_CANDIDATE_TTL_SEC="1800",
    WS_MAX_CANDIDATES="500",
    WS_MAX_ACTIVE_SUBPROVS="10",
    WS_POLL_SEC="2",
    WS_PROMOTE_DISCOVERED="1",
    WS_MAX_PROMOTED_SUBPROVS="10",
    WS_TREASURY_MIN_SOL="0.05",
    WS_CANDIDATE_REJECT_WINDOW_S="7200",
