[unix_http_server]
file=/tmp/watchtower_supervisord.sock

[supervisord]
logfile=%(here)s/../../logs/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/tmp/watchtower_supervisord.pid
nodaemon=false
childlogdir=%(here)s/../../logs/supervisor
; Environment inherited by all child processes
environment=
    PYTHONPATH="/Users/kevinkeaveney/Dev/claude/flex",
    FLEX_WS_DISABLED="1",
    RPC_METRICS_DB="/Users/kevinkeaveney/Dev/claude/flex/database/flex_complete_database.db",
    DB_PATH="/Users/kevinkeaveney/Dev/claude/flex/database/flex_complete_database.db",
    HELIUS_API_KEY="16f1a5fc-2592-466c-a5d4-b5799ae8da96",
    HELIUS_RPC_URL="https://mainnet.helius-rpc.com/?api-key=16f1a5fc-2592-466c-a5d4-b5799ae8da96",
    HELIUS_WS_URL="wss://mainnet.helius-rpc.com/?api-key=16f1a5fc-2592-466c-a5d4-b5799ae8da96",
    CREATOR_MOVEMENT_WEBHOOK_ID="fec2b429-d262-43b9-81d2-31b9efc74f77",
    CREATOR_MOVEMENT_WEBHOOK_URL="https://uncatholical-rylie-phrenetically.ngrok-free.dev/api/webhook/watchtower-candidate",
    TRADING_SIM_DRY_RUN_PUBLIC_KEY="5ZpgwwHAxs5kuer3dwwJQxjxvWaXHaLvchZJCRqigPtJ"

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/watchtower_supervisord.sock

; ── WATCHTOWER API (Gunicorn) ────────────────────────────────────────────────
[program:watchtower_api]
command=/Users/kevinkeaveney/anaconda3/envs/algotrader/bin/gunicorn
    --config /Users/kevinkeaveney/Dev/claude/flex/config/gunicorn.conf.py
    src.core.main:app
directory=/Users/kevinkeaveney/Dev/claude/flex
environment=
    PYTHONPATH="/Users/kevinkeaveney/Dev/claude/flex",
    FLEX_WS_DISABLED="1"
autostart=true
autorestart=true
startretries=999
startsecs=8
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/Users/kevinkeaveney/Dev/claude/flex/logs/supervisor/api.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile=/Users/kevinkeaveney/Dev/claude/flex/logs/supervisor/api_err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2

; ── LISTENER WATCHDOG ────────────────────────────────────────────────────────
[program:watchtower_listener]
command=/bin/bash /Users/kevinkeaveney/Dev/claude/flex/run_listener.sh
directory=/Users/kevinkeaveney/Dev/claude/flex
autostart=true
autorestart=true
startretries=999
startsecs=5
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/Users/kevinkeaveney/Dev/claude/flex/logs/supervisor/listener.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile=/Users/kevinkeaveney/Dev/claude/flex/logs/supervisor/listener_err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2

; ── HELIUS CLI MONITOR ───────────────────────────────────────────────────────
[program:watchtower_helius_monitor]
command=/Users/kevinkeaveney/anaconda3/envs/algotrader/bin/python
    -m src.monitoring.helius_cli_monitor
directory=/Users/kevinkeaveney/Dev/claude/flex
autostart=true
autorestart=true
startretries=999
startsecs=5
stopwaitsecs=10
stdout_logfile=/Users/kevinkeaveney/Dev/claude/flex/logs/supervisor/helius_monitor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile=/Users/kevinkeaveney/Dev/claude/flex/logs/supervisor/helius_monitor_err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=1
