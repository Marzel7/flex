<div class="sidebar">
    <!-- Compatibility vocabulary: Operators now appear under Operator Registry. -->
    <div class="sidebar-logo">
        <div class="sidebar-logo-main">FLEX</div>
        <div class="sidebar-logo-sub"><span class="sidebar-status-dot" id="sh-overall-dot"></span> Operations OS</div>
    </div>

    <nav class="sidebar-nav" aria-label="Primary">

        <div class="sidebar-section sidebar-home">
            <a class="sidebar-item sidebar-home-link {% if active_page == 'ops_os_index' %}active{% endif %}" href="/ops-os">◆ Mission Control</a>
        </div>

        <div class="sidebar-section">
            <div class="sidebar-section-label">Intelligence</div>
            <a class="sidebar-item {% if active_page in ['operators','operation_profile'] %}active{% endif %}" href="/intelligence/operators">Operations Registry</a>
            <a class="sidebar-item {% if active_page == 'live_monitor' %}active{% endif %}" href="/operations/live-monitor">◉ Live Monitor</a>
            <a class="sidebar-item {% if active_page == 'operation_playbook' %}active{% endif %}" href="{{ '/operations/' ~ playbook_operator_id ~ '/playbook' if playbook_operator_id else '/operations/playbooks' }}">▤ Operation Playbook</a>
            <a class="sidebar-item {% if active_page == 'potential_operations' %}active{% endif %}" href="/intelligence/potential-operations">Potential Operations</a>
        </div>

        <!-- ── SYSTEM ─────────────────────────────────────────────────── -->
        <details class="sidebar-section sidebar-collapse" {% if active_page == 'system_health' %}open{% endif %}>
            <summary class="sidebar-section-label">System</summary>
            <a class="sidebar-item {% if active_page == 'system_health' %}active{% endif %}" href="/system-health">System Health</a>
        </details>

    </nav>

    <!-- System health strip -->
    <div id="sys-health-strip" style="
        margin: 12px 8px 8px;
        padding: 8px 10px;
        background: rgba(0,0,0,0.3);
        border: 1px solid rgba(255,255,255,0.07);
        border-radius: 6px;
        font-size: 10px;
        font-family: monospace;
        color: #888;
    ">
        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
            <span id="sh-platform" class="sh-dot">PLAT</span>
            <span id="sh-ingestion" class="sh-dot">INGEST</span>
            <span id="sh-intelligence" class="sh-dot">INTEL</span>
            <span id="sh-infrastructure" class="sh-dot">INFRA</span>
        </div>
        <div id="sh-hb" style="margin-top:5px;color:#555;font-size:9px;">checking shared health…</div>
    </div>
</div>

<style>
.sidebar-collapse { }
.sidebar-collapse > summary {
    cursor: pointer; list-style: none; user-select: none;
    display: flex; align-items: center; justify-content: space-between;
}
.sidebar-collapse > summary::-webkit-details-marker { display: none; }
.sidebar-collapse > summary::after {
    content: "▸"; font-size: 9px; opacity: .5; transition: transform .15s ease;
}
.sidebar-collapse[open] > summary::after { transform: rotate(90deg); }
.sidebar-collapse > summary:hover::after { opacity: .9; }
.sidebar-home { margin-bottom: 4px; }
.sidebar-home-link {
    color: var(--accent-cyan,#22d3ee) !important;
    font-weight: 750;
    letter-spacing: .01em;
}
.legacy-tag {
    margin-left: auto;
    padding: 1px 4px;
    border: 1px solid rgba(148,163,184,.18);
    border-radius: 3px;
    color: #64748b;
    font-size: 8px;
    font-weight: 700;
    letter-spacing: .05em;
    text-transform: uppercase;
}
.legacy-nav .sidebar-item { color: #778195; }

.nav-badge {
    display: none; margin-left: 6px; min-width: 16px; padding: 0 5px;
    border-radius: 9px; background: var(--accent-primary, #3b82f6); color: #fff;
    font-size: 10px; font-weight: 700; text-align: center; line-height: 16px;
}
.nav-badge.show { display: inline-block; }
.sidebar-item { display: flex; align-items: center; }

.sh-dot {
    padding: 1px 5px; border-radius: 3px; background: #333; color: #666;
    font-weight: bold; font-size: 9px; letter-spacing: 0.5px;
}
.sh-dot.ok   { background: rgba(40,160,80,0.25); color: #4caf73; border: 1px solid rgba(40,160,80,0.3); }
.sh-dot.warn { background: rgba(200,150,0,0.25);  color: #c8960a; border: 1px solid rgba(200,150,0,0.3); }
.sh-dot.dead { background: rgba(200,40,40,0.25);  color: #e05555; border: 1px solid rgba(200,40,40,0.3); }
.sh-dot.unknown { background: rgba(100,116,139,0.22); color: #94a3b8; border: 1px solid rgba(148,163,184,0.25); }
</style>

<script>
(function() {
    function healthClass(status) {
        status = String(status || 'UNKNOWN').toUpperCase();
        return status === 'HEALTHY' ? 'ok' : status === 'DEGRADED' ? 'warn' : status === 'DOWN' ? 'dead' : 'unknown';
    }
    function setDot(id, cls, title) {
        var el = document.getElementById(id);
        if (!el) return;
        el.className = 'sh-dot ' + cls;
        el.title = title || '';
    }
    function pollHealth() {
        fetch('/api/health/full').then(function(r){ return r.json(); }).then(function(d) {
            var metrics = d.shared_health_metrics || {};
            var statuses = [];
            ['platform','live_ingestion','intelligence','infrastructure'].forEach(function(key) {
                var metric = metrics[key] || {label:key, status:'UNKNOWN',detail:'Shared health unavailable'};
                statuses.push(metric.status);
                setDot('sh-' + (key === 'live_ingestion' ? 'ingestion' : key), healthClass(metric.status), metric.label + ': ' + metric.status + '. ' + metric.detail);
            });
            var overallCls = statuses.includes('DOWN') || statuses.includes('UNKNOWN') ? 'dead' : statuses.includes('DEGRADED') ? 'warn' : 'ok';
            var dotEl = document.getElementById('sh-overall-dot');
            if (dotEl) {
                var clrMap = {ok: '#22c55e', warn: '#f59e0b', dead: '#ef4444'};
                var glowMap = {ok: 'rgba(34,197,94,.55)', warn: 'rgba(245,158,11,.5)', dead: 'rgba(239,68,68,.5)'};
                dotEl.style.background = clrMap[overallCls];
                dotEl.style.boxShadow = '0 0 9px ' + glowMap[overallCls];
                dotEl.title = overallCls === 'ok' ? 'All systems nominal' : overallCls === 'warn' ? 'Degraded' : 'Critical';
            }

            var hbEl = document.getElementById('sh-hb');
            if (hbEl) {
                hbEl.textContent = 'same authority as System Health';
                hbEl.style.color = '#888';
            }
        }).catch(function() {
            ['sh-platform','sh-ingestion','sh-intelligence','sh-infrastructure'].forEach(function(id){ setDot(id,'dead',''); });
            var dotEl2 = document.getElementById('sh-overall-dot');
            if (dotEl2) { dotEl2.style.background = '#ef4444'; dotEl2.style.boxShadow = '0 0 9px rgba(239,68,68,.5)'; dotEl2.title = 'API unreachable'; }
            var hbEl = document.getElementById('sh-hb');
            if (hbEl) { hbEl.textContent = 'API unreachable'; hbEl.style.color = '#c55'; }
        });
    }
    pollHealth();
    setInterval(pollHealth, 30000);

})();
</script>
