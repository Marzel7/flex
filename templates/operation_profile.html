{% extends "base_shell.html" %}
{% block title %}Reconciled Intelligence Record{% endblock %}
{% block content %}
<style>
.rp-wrap{max-width:1450px;margin:auto;padding:24px}.rp-hero,.rp-panel,.rp-stat{border:1px solid var(--ip-border);background:var(--ip-card);border-radius:10px}.rp-hero{padding:22px;border-left:5px solid var(--rp-color,#64748b)}.rp-row{display:flex;justify-content:space-between;gap:16px;align-items:start}.rp-name{font-size:29px;margin:5px 0}.rp-badge,.rp-chip{display:inline-block;border:1px solid var(--ip-border);border-radius:14px;padding:5px 9px;font-size:10px}.rp-badge{color:var(--rp-color);border-color:var(--rp-color)}.rp-tabs{display:flex;gap:6px;overflow:auto;margin:18px 0}.rp-tab{border:1px solid var(--ip-border);background:transparent;color:var(--ip-sec);padding:8px 11px;border-radius:8px;cursor:pointer;white-space:nowrap}.rp-tab.active{color:#fff;border-color:var(--rp-color)}.rp-panel{padding:18px;margin:12px 0}.rp-panel[hidden]{display:none}.rp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.rp-stat{padding:14px}.rp-stat strong{display:block;font-size:22px}.rp-label,.rp-kicker{font-size:9px;color:var(--ip-dim);text-transform:uppercase;letter-spacing:.09em}.rp-two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.rp-table{width:100%;border-collapse:collapse;font-size:11px}.rp-table td,.rp-table th{padding:9px;border-bottom:1px solid var(--ip-border);text-align:left;vertical-align:top}.rp-mono{font:10px monospace;overflow-wrap:anywhere}.rp-chip{margin:3px}.rp-chain{padding:8px 0;border-bottom:1px solid var(--ip-border);font-size:11px}.rp-form{display:grid;gap:9px}.rp-form input,.rp-form textarea{background:var(--ip-bg);color:var(--ip-text);border:1px solid var(--ip-border);padding:9px;border-radius:7px}.rp-action{background:#166534;color:#fff;border:1px solid #22c55e;border-radius:7px;padding:9px;cursor:pointer}.disp-CONFIRMED_OPERATION{--rp-color:#22c55e}.disp-OPERATOR_CANDIDATE{--rp-color:#60a5fa}.disp-REVIEW{--rp-color:#f59e0b}.disp-INFRASTRUCTURE{--rp-color:#a78bfa}.disp-UNRESOLVED{--rp-color:#94a3b8}.disp-REJECTED,.disp-RETIRED{--rp-color:#64748b}.disp-legacy_attribution{--rp-color:#64748b}@media(max-width:800px){.rp-grid{grid-template-columns:repeat(2,1fr)}.rp-two{grid-template-columns:1fr}}
</style>
<main class="rp-wrap disp-legacy_attribution" id="rp-root">
 <div class="ip-breadcrumb"><a href="/ops-os">Mission Control</a><span class="sep">›</span><a href="/intelligence/operations">Reconciled Intelligence</a><span class="sep">›</span><span id="rp-crumb">Intelligence record</span></div>
 <div id="rp-loading" class="rp-panel">Loading reconciled intelligence record…</div>
 <div id="rp-content" hidden>
  <header class="rp-hero"><div class="rp-row"><div><div class="rp-kicker" id="rp-kicker"></div><h1 class="rp-name" id="rp-name"></h1><p id="rp-subtitle"></p></div><span class="rp-badge" id="rp-state"></span></div></header>
  <nav class="rp-tabs" id="rp-tabs" aria-label="Intelligence record sections"></nav>
  <section class="rp-panel" data-panel="overview"></section><section class="rp-panel" data-panel="readiness" hidden></section><section class="rp-panel" data-panel="clusters" hidden></section><section class="rp-panel" data-panel="reconciliation" hidden></section><section class="rp-panel" data-panel="legacy" hidden></section><section class="rp-panel" data-panel="confirmation" hidden></section><section class="rp-panel" data-panel="topology" hidden><div class="op-topology"></div></section><section class="rp-panel" data-panel="infrastructure" hidden></section><section class="rp-panel" data-panel="participants" hidden></section><section class="rp-panel" data-panel="launches" hidden></section><section class="rp-panel" data-panel="walkback" hidden></section><section class="rp-panel" data-panel="timeline" hidden></section><section class="rp-panel" data-panel="behaviour" hidden></section><section class="rp-panel" data-panel="statistics" hidden></section><section class="rp-panel" data-panel="evidence" hidden></section><section class="rp-panel" data-panel="performance" hidden></section><section class="rp-panel" data-panel="comparison" hidden></section><section class="rp-panel" data-panel="related" hidden></section>
 </div>
</main>
<script>
(function(){
 const entity={{ entity|tojson }},esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),when=t=>t?new Date(t*1000).toLocaleString():'Not established';
 const rows=(xs,fn)=>xs&&xs.length?xs.map(fn).join(''):'<tr><td>No persisted records.</td></tr>',chips=xs=>(xs&&xs.length?xs:['None observed']).map(x=>'<span class="rp-chip">'+esc(x)+'</span>').join('');
 const stats=f=>'<div class="rp-grid">'+[['Launches',f.launches],['Active sessions',f.active_sessions],['Clients',(f.client_wallets||[]).length],['Creators',(f.unique_creators||[]).length],['Treasuries',(f.treasuries||[]).length],['Evidence',f.evidence_completeness.score+'%'],['Significance',f.discovery_significance.score],['Maturity',f.operational_maturity.score]].map(x=>'<div class="rp-stat"><strong>'+esc(x[1])+'</strong><span class="rp-label">'+esc(x[0])+'</span></div>').join('')+'</div>';
 function render(f){
  const rec=f.reconciliation||{},pres=f.presentation||{},disp=rec.disposition||'legacy_attribution',intel=f.intelligence||{},infra=intel.infrastructure||{},audit=intel.evidence_audit||{},perf=intel.performance||{},behaviour=intel.behaviour||{},ecosystem=intel.ecosystem_context||{},reuse=rec.creator_reuse||[];
  const evidenceItem=x=>'<details class="rp-chain"><summary><b>'+esc(x.label||x.evidence_type)+'</b> · '+esc(x.description)+'</summary><div class="rp-grid">'+[['Truth',x.truth_status],['Applicability',x.applicability],['Provenance',x.provenance],['Dependency group',String(x.dependency_group||'').replaceAll('_',' ')],['Independence',String(x.provenance_independence||'').replaceAll('_',' ')],['Observation count',x.observation_count==null?'Not applicable':x.observation_count]].map(v=>'<div class="rp-stat"><strong>'+esc(v[1])+'</strong><span class="rp-label">'+esc(v[0])+'</span></div>').join('')+'</div><p>'+esc(x.applicability_reason||'')+'</p></details>';
  const evidence=(rec.supporting_evidence||[]).map(evidenceItem).join('')||'<p>No reconciled supporting evidence exposed.</p>';
  const contradictions=(rec.contradictory_evidence||[]).map(evidenceItem).join('')||'<p>No persisted contradictions observed.</p>';
  const missing=(rec.missing_evidence||[]).map(evidenceItem).join('')||'<p>No missing evidence is recorded.</p>';
  const reuseHtml=reuse.map(x=>'<div class="rp-chain"><b>Creator reuse</b> · TRUE · '+esc(String(x.applicability||'unknown').replaceAll('_',' '))+' · '+(x.eligible?'disposition-eligible':'not disposition-eligible')+' · '+esc(x.distinct_mint_count)+' distinct mints</div>').join('')||'<p>No creator-reuse observation applies to this revision.</p>';
  const launchRows=perf.launches||[];
  const investigation=pres.kind==='investigation_population',summary=(rec.analyst_explanation||pres.investigation_summary||[]).map(x=>'<p>'+esc(x)+'</p>').join(''),readiness=rec.promotion_readiness||{};
  const clusters=pres.potential_operator_clusters||[],clusterRows=clusters.map(x=>'<div class="rp-panel"><h3>'+esc(x.cluster_id)+'</h3><div class="rp-grid">'+[['Launches',x.launch_count],['Creators',x.creator_count],['Disposition',x.current_disposition]].map(v=>'<div class="rp-stat"><strong>'+esc(v[1])+'</strong><span class="rp-label">'+esc(v[0])+'</span></div>').join('')+'</div><p>'+esc(x.current_evidence||'Evidence remains under reconciliation.')+'</p><h4>Supporting observations</h4>'+chips(x.supporting_observations)+'<h4>Missing evidence</h4>'+chips(x.missing_evidence)+(x.profile_href?'<p><a href="'+esc(x.profile_href)+'">Open child record →</a></p>':'')+'</div>').join('');
  const walkbackRows=(intel.timeline||[]).filter(x=>String(x.type||'').toUpperCase().includes('WALKBACK')||String(x.source||'').toLowerCase().includes('walkback'));
  const panels={
   overview:'<h2>'+(investigation?'Investigation Summary':esc(pres.label||f.lifecycle_state))+'</h2>'+(summary||'<p>'+esc(pres.reasoning_summary||'Reconciliation metadata is unavailable; legacy attribution is shown explicitly.')+'</p>')+stats(f)+'<div class="rp-two"><div><h3>Observed identity context</h3><p>First observed: '+esc(when(f.first_seen_at))+'</p><p>Last material activity: '+esc(when(f.last_material_activity_at))+'</p></div><div><h3>Population basis</h3><p>'+esc(f.dominant_topology||'Not established')+'</p><h3>Mechanisms</h3>'+chips(f.mechanisms)+'</div></div>',
   readiness:'<h2>Promotion Readiness</h2><div class="rp-grid">'+[['Current disposition',rec.disposition||'Legacy fallback'],['Promotion readiness',readiness.state||'NOT ELIGIBLE'],['Confirmation control',readiness.eligible_for_confirmation?'Available':'Not available']].map(x=>'<div class="rp-stat"><strong>'+esc(x[1])+'</strong><span class="rp-label">'+esc(x[0])+'</span></div>').join('')+'</div><p>'+esc(readiness.message||'No readiness assessment is available.')+'</p><h3>Promotion blockers</h3>'+((readiness.blockers||[]).map(x=>'<div class="rp-chain">□ '+esc(x)+'</div>').join('')||'<p>No promotion blockers recorded.</p>')+'<h3>Evidence required</h3>'+((readiness.requirements||[]).map(x=>'<div class="rp-chain">□ '+esc(x)+'</div>').join('')||'<p>No additional evidence requirement recorded.</p>'),
   clusters:'<h2>Potential Operator Clusters</h2>'+(clusterRows||'<p>No independently supported operator clusters identified.</p>')+'<p>Any future evidence-confirmed Operation remains a child of this Investigation Population; the parent evidence set is preserved.</p>',
   reconciliation:'<h2>Evidence Reconciliation</h2><p>Expand any evidence item to inspect truth, applicability, provenance, dependency, independence and observation count.</p><div class="rp-two"><div><h3>Supporting evidence · '+esc(rec.supporting_evidence_count||0)+'</h3>'+evidence+'<h3>Creator reuse semantics</h3>'+reuseHtml+'</div><div><h3>Contradictory evidence · '+esc(rec.contradictory_evidence_count||0)+'</h3>'+contradictions+'<h3>Missing evidence · '+esc(rec.missing_evidence_count||0)+'</h3>'+missing+'</div></div>',
   legacy:'<h2>Legacy Context</h2><div class="rp-grid"><div class="rp-stat"><strong>'+esc(f.lifecycle_state)+'</strong><span class="rp-label">Legacy Classification</span></div></div><p>'+esc(pres.historical_context||'Family Builder classification prior to Evidence Reconciliation. Legacy context does not override the reconciled disposition.')+'</p>',
   topology:'<h2>Observed topology</h2><p>'+esc(f.dominant_topology||'Evidence accumulation incomplete')+'</p><h3>Topology variants</h3>'+chips(infra.topology_variants),
   infrastructure:'<h2>Infrastructure context</h2><div class="rp-two"><div><h3>Treasuries</h3>'+chips(infra.treasuries)+'<h3>Persistent clients</h3>'+chips(infra.persistent_clients)+'</div><div><h3>Known relays</h3>'+chips(infra.known_relays)+'<h3>Mechanisms</h3>'+chips(infra.mechanisms)+'</div></div><p>Funding paths: '+esc((infra.funding_paths||[]).length)+' persisted reconstructions. Zero means unavailable or not reconstructed, not proof that no topology exists.</p>',
   participants:'<h2>Observed participants</h2><div class="rp-two"><div><h3>Clients</h3>'+chips(f.client_wallets)+'</div><div><h3>Creators</h3>'+chips(f.unique_creators)+'</div></div>',
   launches:'<h2>Launch population</h2><table class="rp-table"><thead><tr><th>Mint</th><th>Created</th><th>Migrated</th><th>Peak market cap</th></tr></thead><tbody>'+rows(launchRows,x=>'<tr><td><a href="'+esc(x.token_href)+'">'+esc(x.mint)+'</a></td><td>'+esc(when(x.created_at))+'</td><td>'+esc(x.migrated?'Yes':'No persisted migration')+'</td><td>'+esc(x.peak_market_cap==null?'Not available':x.peak_market_cap)+'</td></tr>')+'</tbody></table>',
   walkback:'<h2>Walkback evidence</h2><table class="rp-table"><thead><tr><th>Time</th><th>Result</th><th>Detail</th><th>Source</th></tr></thead><tbody>'+rows(walkbackRows,e=>'<tr><td>'+esc(when(e.timestamp))+'</td><td>'+esc(e.type)+'</td><td>'+esc(e.label)+'</td><td>'+esc(e.source)+'</td></tr>')+'</tbody></table>',
   timeline:'<h2>Observed timeline</h2><table class="rp-table"><thead><tr><th>Time</th><th>Event</th><th>Detail</th><th>Source</th></tr></thead><tbody>'+rows(intel.timeline,e=>'<tr><td>'+esc(when(e.timestamp))+'</td><td>'+esc(e.type)+'</td><td>'+esc(e.label)+'</td><td>'+esc(e.source)+'</td></tr>')+'</tbody></table>',
   behaviour:'<h2>Observed behaviour</h2><p>Launch frequency: '+esc(behaviour.launch_frequency_per_active_day==null?'Not established':behaviour.launch_frequency_per_active_day+' per active day')+'</p><h3>Operational changes</h3>'+chips(behaviour.operational_changes),
   statistics:'<h2>Population statistics</h2>'+stats(f),
   evidence:'<h2>Traceable evidence audit</h2><p>'+esc(audit.confidence_explanation||'See the reconciled evidence package for disposition evidence.')+'</p><div class="rp-two"><div><h3>Outstanding questions</h3>'+chips(audit.outstanding_questions)+'</div><div><h3>Conflicts and exclusions</h3>'+chips([...(audit.conflicts||[]),...(audit.exclusions||[]).map(x=>x.type+': '+x.detail)])+'</div></div>',
   performance:'<h2>Persisted performance</h2><p>Only persisted metrics are shown.</p>'+stats(f),
   comparison:'<h2>Cross-operation comparison</h2><p>Compare this reconciled record using the same persisted evidence dimensions.</p>'+chips((intel.comparison_peers||[]).map(x=>x.family_name)),
   related:'<h2>Ecosystem context</h2><p>Related records remain evidence context; proximity does not change reconciled disposition.</p>'+chips((ecosystem.related_operations||[]).map(x=>x.family_name)),
   confirmation:'<h2>Operation confirmation</h2><p>This action is available only when reconciliation resolves the population as an Operator Candidate.</p><h3>Readiness checklist</h3><p>Reconciled candidate disposition is required.</p><h3>Outstanding Issues</h3><p>Resolve contradictory and missing evidence before confirmation.</p><div class="rp-form"><input id="rp-by" placeholder="Analyst"><input id="rp-reason" placeholder="Confirmation reason"><textarea id="rp-notes" placeholder="Notes (optional)"></textarea><button class="rp-action" id="rp-confirm">Confirm operation</button><div id="rp-result"></div></div><!-- Reverse confirmation remains available through /reverse-confirmation for legacy confirmed records. -->'
  };
  Object.entries(panels).forEach(([k,v])=>document.querySelector('[data-panel="'+k+'"]').innerHTML=v);
  const ordinary=disp==='CONFIRMED_OPERATION'||disp==='OPERATOR_CANDIDATE',tabs=[['overview','Overview'],['readiness','Promotion Readiness']];if(investigation)tabs.push(['clusters','Potential Operator Clusters']);tabs.push(['reconciliation','Reconciliation'],['topology','Topology'],['infrastructure','Infrastructure'],['participants','Participants'],['launches','Launches'],['walkback','Walkback'],['timeline','Timeline'],['behaviour','Behaviour'],['statistics','Statistics'],['evidence','Evidence'],['legacy','Legacy Context']);
  if(ordinary)tabs.push(['performance','Performance'],['comparison','Compare'],['related','Ecosystem']);if(pres.confirmation_permitted)tabs.push(['confirmation','Confirmation']);
  document.getElementById('rp-tabs').innerHTML=tabs.map((x,i)=>'<button class="rp-tab '+(i?'':'active')+'" data-tab="'+x[0]+'">'+x[1]+'</button>').join('');
  document.querySelectorAll('.rp-tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.rp-tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('[data-panel]').forEach(x=>x.hidden=x.dataset.panel!==b.dataset.tab)});
  const btn=document.getElementById('rp-confirm');if(btn&&pres.confirmation_permitted)btn.onclick=()=>{btn.disabled=true;fetch('/api/ops/operations/'+encodeURIComponent(f.family_id)+'/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({confirmed_by:document.getElementById('rp-by').value,confirmation_reason:document.getElementById('rp-reason').value,confirmation_notes:document.getElementById('rp-notes').value})}).then(async r=>{let d=await r.json();if(!r.ok)throw Error(d.error||'Confirmation failed');location.reload()}).catch(e=>{btn.disabled=false;document.getElementById('rp-result').textContent=e.message})};
  document.title=(investigation?'Investigation Population':'Operation Profile')+' — '+(f.family_name||'Intelligence Record');document.getElementById('rp-root').className='rp-wrap disp-'+disp;document.getElementById('rp-name').textContent=pres.title||f.family_name;document.getElementById('rp-state').textContent=investigation?(pres.disposition_label||disp):pres.label||f.lifecycle_state;document.getElementById('rp-kicker').textContent=pres.profile_kicker||'Legacy attribution record';document.getElementById('rp-crumb').textContent=pres.label||'Intelligence record';document.getElementById('rp-subtitle').textContent=investigation?'Population · '+(f.launches||0)+' launches':'Operational Intelligence · '+(f.launches||0)+' launches';document.getElementById('rp-loading').hidden=true;document.getElementById('rp-content').hidden=false;
 }
 fetch('/api/ops/emerging-operators/'+encodeURIComponent(entity)).then(r=>r.json()).then(x=>render(x.family)).catch(e=>{document.getElementById('rp-loading').textContent='Unable to load record: '+e.message});
})();
</script>
{% endblock %}
