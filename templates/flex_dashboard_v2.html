<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLEX Intelligence Dashboard</title>

    <!-- Bootstrap 5.3 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- Font Awesome 6.4 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- DataTables 1.13 with Bootstrap 5 theme -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">

    <!-- Chart.js 4.4 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- Cytoscape.js 3.26 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>

    <style>
        :root {
            --color-critical: #ef4444;
            --color-high: #f97316;
            --color-watch: #eab308;
            --color-low: #84cc16;
            --color-neutral: #6b7280;
            --color-primary: #3b82f6;
            --color-secondary: #6366f1;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
        }

        * { box-sizing: border-box; }

        body {
            background: var(--bg-dark);
            color: var(--text-secondary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Sidebar Navigation */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            height: 100vh;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
            padding: 1rem 0;
            z-index: 1000;
        }

        .sidebar-brand {
            padding: 1rem 1.5rem;
            font-weight: 700;
            font-size: 1.25rem;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-section {
            padding: 1rem 0;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-section-title {
            padding: 0.5rem 1.5rem;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #94a3b8;
            letter-spacing: 0.05em;
        }

        .nav-link {
            padding: 0.75rem 1.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .nav-link:hover {
            background: rgba(59, 130, 246, 0.1);
            color: var(--color-primary);
        }

        .nav-link.active {
            background: rgba(59, 130, 246, 0.2);
            color: var(--color-primary);
            border-left: 3px solid var(--color-primary);
            padding-left: calc(1.5rem - 3px);
        }

        .nav-link i { width: 1.25rem; text-align: center; }

        /* Main Content */
        main {
            margin-left: 260px;
            padding: 2rem;
            min-height: 100vh;
        }

        .page-header {
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border-color);
        }

        .page-header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0;
        }

        .page-header .subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-top: 0.5rem;
        }

        /* Cards */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .card-header {
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 1.5rem;
        }

        .card-body {
            padding: 1.5rem;
        }

        /* Stats Grid */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 1.5rem;
            animation: slideIn 0.5s ease-out;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            line-height: 1;
            color: var(--text-primary);
        }

        .stat-label {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-top: 0.5rem;
        }

        .stat-change {
            font-size: 0.85rem;
            margin-top: 0.75rem;
            padding: 0.25rem 0.75rem;
            border-radius: 0.375rem;
            display: inline-block;
        }

        .stat-change.positive { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
        .stat-change.negative { background: rgba(239, 68, 68, 0.2); color: #ef4444; }

        /* Badges */
        .badge-critical { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
        .badge-high { background: rgba(249, 115, 22, 0.2); color: #fed7aa; }
        .badge-watch { background: rgba(234, 179, 8, 0.2); color: #fde047; }
        .badge-low { background: rgba(132, 204, 22, 0.2); color: #bef264; }

        /* Signal Grid */
        .signal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .signal-item {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 1rem;
            animation: slideIn 0.5s ease-out;
        }

        .signal-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .signal-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .signal-bar {
            width: 100%;
            height: 8px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
            margin-top: 0.5rem;
            overflow: hidden;
        }

        .signal-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        /* Score Bars */
        .score-bar {
            height: 24px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
            overflow: hidden;
            margin: 0.5rem 0;
        }

        .score-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 600;
            color: white;
            min-width: 40px;
        }

        /* Timeline */
        .timeline {
            position: relative;
            padding: 2rem 0;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 20px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--border-color);
        }

        .timeline-item {
            margin-bottom: 2rem;
            padding-left: 60px;
            position: relative;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: 9px;
            top: 5px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
        }

        .timeline-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 1rem;
        }

        .timeline-card-title {
            font-weight: 600;
            color: var(--text-primary);
        }

        .timeline-card-date {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 0.25rem;
        }

        /* Charts */
        .chart-container {
            position: relative;
            height: 300px;
            margin-bottom: 1.5rem;
        }

        .chart-container-small {
            position: relative;
            height: 200px;
            margin-bottom: 1.5rem;
        }

        /* Tables */
        table {
            color: var(--text-secondary);
        }

        table thead th {
            background: rgba(0, 0, 0, 0.2);
            border-color: var(--border-color);
            color: var(--text-primary);
            font-weight: 600;
        }

        table tbody td {
            border-color: var(--border-color);
            vertical-align: middle;
        }

        table tbody tr {
            transition: background 0.2s;
        }

        table tbody tr:hover {
            background: rgba(59, 130, 246, 0.1) !important;
        }

        .dt-control {
            cursor: pointer;
            padding: 0.5rem;
        }

        /* Buttons */
        .btn-primary {
            background: var(--color-primary);
            border: none;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }

        .btn-sm {
            padding: 0.375rem 0.75rem;
            font-size: 0.85rem;
        }

        /* Forms */
        .form-control, .form-select {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .form-control:focus, .form-select:focus {
            background: rgba(0, 0, 0, 0.3);
            border-color: var(--color-primary);
            color: var(--text-primary);
        }

        .form-label {
            color: var(--text-primary);
            font-weight: 500;
        }

        /* Cytoscape Graph */
        #cytoscape-container {
            width: 100%;
            height: 500px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            margin-top: 1rem;
        }

        /* Loading Spinner */
        .spinner-border {
            border-color: rgba(59, 130, 246, 0.3);
            border-right-color: var(--color-primary);
        }

        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 3rem;
            color: #94a3b8;
        }

        /* Animations */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .slide-in {
            animation: slideIn 0.3s ease-out;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                padding: 0;
            }

            main {
                margin-left: 0;
                padding: 1rem;
            }

            .nav-link {
                display: inline-block;
                padding: 0.5rem 1rem;
            }

            .page-header h1 {
                font-size: 1.5rem;
            }

            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }

            .signal-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Alert */
        .alert {
            border-radius: 0.5rem;
            border: 1px solid var(--border-color);
        }

        .alert-danger {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
        }

        .alert-warning {
            background: rgba(249, 115, 22, 0.1);
            color: #fed7aa;
        }

        .alert-info {
            background: rgba(59, 130, 246, 0.1);
            color: #bfdbfe;
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.1);
            color: #86efac;
        }

        /* Real-time price stream visual feedback */
        .price-up {
            background: rgba(34, 197, 94, 0.2) !important;
            color: #22c55e !important;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .price-down {
            background: rgba(239, 68, 68, 0.2) !important;
            color: #ef4444 !important;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Stable sort with FLIP animation */
        [data-mint] {
            will-change: transform;
        }

        [data-mint] * {
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <!-- Sidebar Navigation -->
    <nav class="sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-bolt"></i> FLEX
        </div>

        <!-- Main Navigation -->
        <div class="nav-section">
            <div class="nav-section-title">Intelligence</div>
            <a class="nav-link active" onclick="loadPage('dashboard')">
                <i class="fas fa-chart-line"></i> <span>Dashboard</span>
            </a>
            <a class="nav-link" onclick="loadPage('radar')">
                <i class="fas fa-radar"></i> <span>Launch Radar</span>
            </a>
            <a class="nav-link" onclick="loadPage('org_explorer')">
                <i class="fas fa-list"></i> <span>Organizations</span>
            </a>
            <a class="nav-link" onclick="loadPage('waves')">
                <i class="fas fa-water"></i> <span>Launch Waves</span>
            </a>
        </div>

        <!-- Analytics -->
        <div class="nav-section">
            <div class="nav-section-title">Analytics</div>
            <a class="nav-link" onclick="loadPage('clusters')">
                <i class="fas fa-network-wired"></i> <span>Dev Clusters</span>
            </a>
            <a class="nav-link" onclick="loadPage('signal_explorer')">
                <i class="fas fa-sliders-h"></i> <span>Signals</span>
            </a>
        </div>

        <!-- Tools -->
        <div class="nav-section">
            <div class="nav-section-title">Tools</div>
            <a class="nav-link" onclick="showWalletSearch()">
                <i class="fas fa-wallet"></i> <span>Wallet Search</span>
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main id="page-content">
        <!-- Content loaded here -->
    </main>

    <!-- JavaScript Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

    <script>
        const API_BASE = '/api';
        let currentPage = 'dashboard';
        let currentCharts = [];

        // Utility: Format numbers
        const formatNumber = (n) => n?.toLocaleString() || '0';
        const formatPercent = (v) => `${(v * 100).toFixed(0)}%`;
        const formatDate = (ts) => ts ? new Date(ts * 1000).toLocaleDateString() : 'N/A';
        const formatWallet = (addr) => addr ? addr.substring(0, 8) + '...' : 'N/A';

        // Utility: Alert badge
        const alertBadge = (level) => {
            const badges = {
                'CRITICAL': '<span class="badge badge-critical">CRITICAL</span>',
                'HIGH': '<span class="badge badge-high">HIGH</span>',
                'WATCH': '<span class="badge badge-watch">WATCH</span>',
                'LOW': '<span class="badge badge-low">LOW</span>',
            };
            return badges[level] || '<span class="badge badge-neutral">UNKNOWN</span>';
        };

        // =====================================================================
        // REAL-TIME PRICE STREAMING (SSE) WITH STABLE SORT
        // =====================================================================

        // In-memory token map: mint → {price, marketCap, source, updatedAt}
        const tokenMap = new Map();
        let needsResort = false;
        let userInteracting = false;
        let sortColumn = 'price'; // 'price' or 'marketCap'
        let sortDirection = 'desc'; // 'asc' or 'desc'

        function updateTokenPrice(update) {
            const mint = update.mint;
            const row = document.querySelector(`[data-mint="${mint}"]`);
            if (!row) return;

            // Update in-memory data
            if (!tokenMap.has(mint)) {
                tokenMap.set(mint, {});
            }
            const token = tokenMap.get(mint);
            token.price = update.price_usd;
            token.marketCap = update.market_cap;
            token.source = update.source;
            token.updatedAt = Date.now();

            // Update price display with flash effect
            const priceElem = row.querySelector('.token-price');
            if (priceElem) {
                const oldPrice = parseFloat(priceElem.dataset.lastPrice || 0);
                const newPrice = update.price_usd;

                priceElem.textContent = newPrice.toFixed(8);
                priceElem.dataset.lastPrice = newPrice;

                if (newPrice > oldPrice && oldPrice > 0) {
                    priceElem.classList.add('price-up');
                } else if (newPrice < oldPrice && oldPrice > 0) {
                    priceElem.classList.add('price-down');
                }

                setTimeout(() => {
                    priceElem.classList.remove('price-up', 'price-down');
                }, 500);
            }

            // Update source badge
            const sourceCells = row.querySelectorAll('td');
            if (sourceCells.length >= 3) {
                const sourceCell = sourceCells[2];
                const badgeColor = update.source === 'pool' ? 'bg-success' : 'bg-secondary';
                const badgeText = update.source === 'pool' ? '🌊 Pool' : '📊 DexScreener';
                sourceCell.innerHTML = `<span class="badge ${badgeColor}" style="font-size: 0.75rem;">${badgeText}</span>`;
            }

            // Mark for resort (don't sort immediately)
            needsResort = true;
        }

        // Batched sort loop - runs every 500ms
        function startSortLoop() {
            setInterval(() => {
                if (!needsResort || userInteracting) return;

                needsResort = false;
                resortTokenTable();
            }, 500);
        }

        // FLIP animation for smooth row movement
        function applyFLIPAnimation(oldRows, newOrder) {
            const parent = oldRows[0]?.parentNode;
            if (!parent) return;

            // Step 1: Record FIRST positions
            const firstPositions = new Map();
            oldRows.forEach(row => {
                firstPositions.set(row.dataset.mint, row.getBoundingClientRect());
            });

            // Step 2: Reorder DOM
            newOrder.forEach(row => parent.appendChild(row));

            // Step 3: Apply transforms and animate
            requestAnimationFrame(() => {
                newOrder.forEach(row => {
                    const first = firstPositions.get(row.dataset.mint);
                    const last = row.getBoundingClientRect();

                    const dx = first.left - last.left;
                    const dy = first.top - last.top;

                    if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
                        row.style.transform = `translate(${dx}px, ${dy}px)`;
                        row.style.transition = 'none';

                        // Trigger reflow
                        row.offsetHeight;

                        row.style.transform = '';
                        row.style.transition = 'transform 300ms cubic-bezier(0.34, 1.56, 0.64, 1)';
                    }
                });
            });
        }

        function resortTokenTable() {
            const tbody = document.querySelector('table tbody');
            if (!tbody) return;

            const rows = Array.from(tbody.querySelectorAll('[data-mint]'));
            if (rows.length === 0) return;

            // Sort rows based on column
            const sorted = rows.sort((a, b) => {
                const aMint = a.dataset.mint;
                const bMint = b.dataset.mint;
                const aData = tokenMap.get(aMint) || {};
                const bData = tokenMap.get(bMint) || {};

                let aVal, bVal;
                if (sortColumn === 'price') {
                    aVal = aData.price || 0;
                    bVal = bData.price || 0;
                } else if (sortColumn === 'marketCap') {
                    aVal = aData.marketCap || 0;
                    bVal = bData.marketCap || 0;
                }

                return sortDirection === 'desc' ? bVal - aVal : aVal - bVal;
            });

            // Check if order actually changed
            let orderChanged = false;
            for (let i = 0; i < rows.length; i++) {
                if (rows[i] !== sorted[i]) {
                    orderChanged = true;
                    break;
                }
            }

            if (orderChanged) {
                console.log('[RESORT] Reordering table with FLIP animation');
                applyFLIPAnimation(rows, sorted);
            }
        }

        function initPriceStream() {
            console.log('[PRICE_STREAM] Initializing connection...');
            const es = new EventSource('/api/price-stream');
            let eventCount = 0;

            // Start batched sort loop
            startSortLoop();

            // Track user interaction
            document.addEventListener('mouseenter', () => { userInteracting = true; }, true);
            document.addEventListener('mouseleave', () => { userInteracting = false; }, true);
            document.addEventListener('touchstart', () => { userInteracting = true; }, true);
            document.addEventListener('touchend', () => {
                userInteracting = false;
                // Resume sorting after touch
                needsResort = true;
            }, true);

            es.onopen = () => {
                console.log('[PRICE_STREAM] ✅ EventSource opened successfully');
            };

            es.onmessage = (event) => {
                try {
                    const update = JSON.parse(event.data);
                    eventCount++;
                    console.log(`[PRICE_STREAM] Event #${eventCount}: ${update.mint.slice(0, 8)}... @ $${update.price_usd.toFixed(8)}`);

                    if (update.type === 'price_update') {
                        updateTokenPrice(update);
                    }
                } catch (error) {
                    console.error('[PRICE_STREAM] Parse error:', error, 'Raw data:', event.data);
                }
            };

            es.onerror = (error) => {
                console.error('[PRICE_STREAM] ❌ Connection error:', error);
                console.log('[PRICE_STREAM] Browser will attempt auto-reconnect...');
            };

            window.addEventListener('beforeunload', () => {
                es.close();
                console.log(`[PRICE_STREAM] Connection closed. Received ${eventCount} events.`);
            });

            console.log('[PRICE_STREAM] ✅ Connected to /api/price-stream');
        }

        // Utility: Load page
        const loadPage = (page) => {
            currentPage = page;
            document.querySelectorAll('.sidebar .nav-link').forEach(link => link.classList.remove('active'));
            event.target.closest('.nav-link').classList.add('active');

            const routes = {
                'dashboard': loadDashboard,
                'radar': loadLaunchRadar,
                'org_explorer': loadOrgExplorer,
                'waves': loadLaunchWaves,
                'clusters': loadClusterExplorer,
                'signal_explorer': loadSignalExplorer,
            };
            (routes[page] || loadDashboard)();
        };

        // Utility: Show loading spinner
        const showLoading = (title = 'Loading...') => {
            return `
                <div class="page-header">
                    <h1>${title}</h1>
                </div>
                <div class="loading-container">
                    <div class="spinner-border" role="status"></div>
                    <p>${title}</p>
                </div>
            `;
        };

        // Utility: Destroy all charts
        const destroyCharts = () => {
            currentCharts.forEach(chart => chart?.destroy?.());
            currentCharts = [];
        };

        // Utility: Create chart
        const createChart = (ctx, config) => {
            destroyCharts();
            const chart = new Chart(ctx, config);
            currentCharts.push(chart);
            return chart;
        };

        // PAGE 1: DASHBOARD
        async function loadDashboard() {
            const content = document.getElementById('page-content');
            content.innerHTML = showLoading('Dashboard');

            try {
                const response = await fetch(`${API_BASE}/dashboard`);
                const data = await response.json();

                let html = `
                    <div class="page-header">

                                            <td>${c.wallet_count}</td>
                                            <td>${c.creator_count}</td>
                                            <td>${c.token_count}</td>
                                            <td>
                                                <span class="${c.average_rug_probability > 0.7 ? 'badge-critical' : c.average_rug_probability > 0.5 ? 'badge-high' : 'badge-low'}">
                                                    ${formatPercent(c.average_rug_probability)}
                                                </span>
                                            </td>
                                            <td>${formatDate(c.first_seen)}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;

                content.innerHTML = html;

                window.showClusterDetail = (clusterId) => {
                    const cluster = clusters.find(c => c.cluster_id === clusterId);
                    const detail = document.getElementById('clusterDetail');
                    detail.innerHTML = `
                        <h6>${cluster.cluster_id}</h6>
                        <div class="stats-row" style="grid-template-columns: 1fr 1fr;">
                            <div class="stat-card">
                                <div class="stat-value">${formatPercent(cluster.cluster_strength)}</div>
                                <div class="stat-label">Strength</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value" style="color: var(--color-critical);">${formatPercent(cluster.average_rug_probability)}</div>
                                <div class="stat-label">Avg Rug Prob</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value">${cluster.wallet_count}</div>
                                <div class="stat-label">Wallets</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value">${cluster.creator_count}</div>
                                <div class="stat-label">Creators</div>
                            </div>
                        </div>
                        <div class="mt-3">
                            <small class="text-muted">
                                First seen: ${formatDate(cluster.first_seen)}<br>
                                Last updated: ${formatDate(cluster.last_updated)}
                            </small>
                        </div>
                    `;
                };

                $('#clustersTable').DataTable({ paging: false });

            } catch (error) {
                content.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
            }
        }

        // PAGE 7: SIGNAL EXPLORER
        async function loadSignalExplorer() {
            const content = document.getElementById('page-content');
            content.innerHTML = `
                <div class="page-header">
                    <h1>Signal Explorer</h1>
                    <p class="subtitle">Interactive visualization of predictive signals</p>
                </div>

                <div class="card">
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Organization ID</label>
                                <input type="number" id="signalOrgId" class="form-control" placeholder="Enter org ID or leave empty for top critical">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">&nbsp;</label>
                                <button class="btn btn-primary w-100" onclick="loadSignalData()">
                                    <i class="fas fa-search"></i> Load Signals
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="signalContent"></div>
            `;

            window.loadSignalData = async () => {
                const orgId = document.getElementById('signalOrgId').value;
                const endpoint = orgId ? `${API_BASE}/signals/${orgId}` : `${API_BASE}/launch-leaderboard?limit=1`;

                try {
                    let signals;
                    if (orgId) {
                        const resp = await fetch(endpoint);
                        signals = await resp.json();
                    } else {
                        const resp = await fetch(endpoint);
                        const data = await resp.json();
                        if (data.length === 0) throw new Error('No CRITICAL organizations found');
                        signals = data[0];
                    }

                    const signalData = [
                        signals.launch_probability,
                        signals.launch_wave_score,
                        signals.seed_concentration,
                        signals.funder_overlap_score,
                        signals.organization_momentum,
                        signals.creator_reuse_score,
                        signals.operator_activity_score,
                        signals.reputation_adjustment,
                    ];

                    let html = `
                        <div class="card">
                            <div class="card-header">
                                <h5 class="mb-0">Signal Radar Chart</h5>
                            </div>
                            <div class="card-body">
                                <div class="chart-container">
                                    <canvas id="radarChart"></canvas>
                                </div>
                            </div>
                        </div>

                        <div class="card">
                            <div class="card-header">
                                <h5 class="mb-0">Signal Details</h5>
                            </div>
                            <div class="card-body">
                                <div class="signal-grid">
                                    ${[
                                        ['Launch Probability', signals.launch_probability],
                                        ['Launch Wave Score', signals.launch_wave_score],
                                        ['Seed Concentration', signals.seed_concentration],
                                        ['Funder Overlap', signals.funder_overlap_score],
                                        ['Organization Momentum', signals.organization_momentum],
                                        ['Creator Reuse', signals.creator_reuse_score],
                                        ['Operator Activity', signals.operator_activity_score],
                                        ['Reputation Adjustment', signals.reputation_adjustment],
                                    ].map(([name, value]) => `
                                        <div class="signal-item">
                                            <div class="signal-name">${name}</div>
                                            <div class="signal-value">${formatPercent(value)}</div>
                                            <div class="signal-bar">
                                                <div class="signal-bar-fill" style="width: ${value * 100}%"></div>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>

                        <div class="card">
                            <div class="card-header">
                                <h5 class="mb-0">Master Launch Score</h5>
                            </div>
                            <div class="card-body">
                                <div class="score-bar" style="height: 40px;">
                                    <div class="score-fill" style="width: ${signals.master_launch_score * 100}%; font-size: 1rem;">
                                        ${formatPercent(signals.master_launch_score)}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;

                    document.getElementById('signalContent').innerHTML = html;

                    createChart(document.getElementById('radarChart'), {
                        type: 'radar',
                        data: {
                            labels: [
                                'Launch Prob', 'Wave Score', 'Seed Conc',
                                'Funder Overlap', 'Momentum', 'Creator Reuse',
                                'Operator Activity', 'Reputation'
                            ],
                            datasets: [{
                                label: 'Signals',
                                data: signalData.map(v => (v || 0) * 100),
                                borderColor: '#3b82f6',
                                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                                fill: true,
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                r: {
                                    beginAtZero: true,
                                    max: 100,
                                    ticks: { color: '#cbd5e1' },
                                    grid: { color: 'rgba(51, 65, 85, 0.5)' }
                                }
                            },
                            plugins: { legend: { labels: { color: '#cbd5e1' } } }
                        }
                    });

                } catch (error) {
                    document.getElementById('signalContent').innerHTML = `
                        <div class="alert alert-danger">Error: ${error.message}</div>
                    `;
                }
            };

            // Auto-load top critical org
            loadSignalData();
        }

        // PAGE 8: WALLET SEARCH
        async function showWalletSearch() {
            const content = document.getElementById('page-content');
            content.innerHTML = `
                <div class="page-header">
                    <h1>Wallet Search</h1>
                    <p class="subtitle">Search wallet intelligence</p>
                </div>

                <div class="card">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-10">
                                <input type="text" id="walletInput" class="form-control form-control-lg" placeholder="Enter wallet address...">
                            </div>
                            <div class="col-md-2">
                                <button class="btn btn-primary btn-lg w-100" onclick="loadWalletIntelligence(document.getElementById('walletInput').value)">
                                    <i class="fas fa-search"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="walletContent"></div>
            `;
        }

        // Load wallet intelligence
        async function loadWalletIntelligence(address) {
            const content = document.getElementById('walletContent');
            content.innerHTML = showLoading('Wallet');

            try {
                const resp = await fetch(`${API_BASE}/wallet/${address}`);
                if (!resp.ok) throw new Error('Wallet not found');
                const wallet = await resp.json();

                let html = `
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0">Wallet Profile</h5>
                        </div>
                        <div class="card-body">
                            <div class="stats-row">
                                <div class="stat-card">
                                    <div class="stat-value">${wallet.member_type}</div>
                                    <div class="stat-label">Member Type</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-value">${wallet.organization_id || 'N/A'}</div>
                                    <div class="stat-label">Organization</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-value">${wallet.reputation?.tokens_launched || 0}</div>
                                    <div class="stat-label">Tokens Launched</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-value" style="color: var(--color-critical);">${formatPercent(wallet.reputation?.rug_rate || 0)}</div>
                                    <div class="stat-label">Rug Rate</div>
                                </div>
                            </div>

                            <div class="row mt-3">
                                <div class="col-md-4">
                                    <strong>Address:</strong><br>
                                    <code style="word-break: break-all;">${wallet.wallet_address}</code>
                                </div>
                                <div class="col-md-4">
                                    <strong>Success Rate:</strong><br>
                                    ${formatPercent(wallet.reputation?.success_rate || 0)}
                                </div>
                                <div class="col-md-4">
                                    <strong>Reputation Score:</strong><br>
                                    ${formatPercent(wallet.reputation?.reputation_score || 0)}
                                </div>
                            </div>
                        </div>
                    </div>

                    ${wallet.organization_id ? `
                        <div class="text-center mt-3">
                            <button class="btn btn-primary" onclick="loadOrgProfile(${wallet.organization_id})">
                                <i class="fas fa-building"></i> View Organization
                            </button>
                        </div>
                    ` : ''}

                    <div class="card mt-3">
                        <div class="card-header">
                            <h5 class="mb-0">Tokens</h5>
                        </div>
                        <div class="card-body">
                            <table class="table table-sm">
                                <thead>
                                    <tr>
                                        <th>Mint</th>
                                        <th>Live Price</th>
                                        <th>Source</th>
                                        <th>Rug Probability</th>
                                        <th>Created</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${(wallet.tokens || []).map(t => `
                                        <tr data-mint="${t.mint}">
                                            <td><code>${t.mint?.substring(0, 8)}...</code></td>
                                            <td class="token-price" style="font-weight: 600;">-</td>
                                            <td><span class="badge bg-secondary" style="font-size: 0.75rem;">Loading...</span></td>
                                            <td>${formatPercent(t.rug_probability)}</td>
                                            <td>${formatDate(t.created_at)}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;

                content.innerHTML = html;

            } catch (error) {
                content.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
            }
        }

        // PAGE ROUTING
        const PAGE = '{{ page }}';
        const PAGE_ORG_ID = '{{ org_id | default("") }}';
        const PAGE_WALLET = '{{ wallet_address | default("") }}';

        window.addEventListener('load', () => {
            // Initialize real-time price streaming
            initPriceStream();

            const routes = {
                'dashboard': loadDashboard,
                'radar': loadLaunchRadar,
                'org_explorer': loadOrgExplorer,
                'organization': () => loadOrgProfile(PAGE_ORG_ID),
                'waves': loadLaunchWaves,
                'clusters': loadClusterExplorer,
                'wallet': () => {
                    showWalletSearch();
                    loadWalletIntelligence(PAGE_WALLET);
                },
                'signal_explorer': loadSignalExplorer,
            };

            (routes[PAGE] || routes['dashboard'])();
        });
    </script>
</body>
</html>
