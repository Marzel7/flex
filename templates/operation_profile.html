{% extends "base_shell.html" %}
{% block title %}Reconciled Intelligence Record{% endblock %}
{% block content %}
<style>
.rp-wrap{max-width:1280px;margin:auto;padding:24px}.rp-hero,.rp-panel,.rp-stat,.rp-disclosure{border:1px solid var(--ip-border);background:var(--ip-card);border-radius:10px}.rp-hero{padding:18px 20px;border-left:5px solid var(--rp-color,#64748b)}.rp-row{display:flex;justify-content:space-between;gap:16px;align-items:start}.rp-name{font-size:28px;margin:4px 0}.rp-hero-line{margin:7px 0 0;color:var(--ip-sec);font-size:13px}.rp-hero-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:9px}.rp-badge,.rp-chip,.rp-ready{display:inline-block;border:1px solid var(--ip-border);border-radius:14px;padding:4px 8px;font-size:9px}.rp-badge{color:var(--rp-color);border-color:var(--rp-color);font-weight:700}.rp-ready{color:var(--ip-sec)}.rp-tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0}.rp-tab{border:1px solid var(--ip-border);background:transparent;color:var(--ip-sec);padding:9px;border-radius:8px;cursor:pointer}.rp-tab.active{color:#fff;border-color:var(--rp-color);background:color-mix(in srgb,var(--rp-color) 10%,transparent)}.rp-panel{padding:16px;margin:10px 0}.rp-panel[hidden]{display:none}.rp-primary-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}.rp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.rp-stat{padding:11px}.rp-stat strong{display:block;font-size:18px}.rp-primary-kpis .rp-stat strong{font-size:20px}.rp-label,.rp-kicker{font-size:8px;color:var(--ip-dim);text-transform:uppercase;letter-spacing:.09em}.rp-summary{max-width:820px}.rp-summary p{margin:5px 0;font-size:12px}.rp-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rp-disclosure{margin:9px 0;padding:0 13px}.rp-disclosure>summary{cursor:pointer;padding:12px 0;font-weight:700}.rp-disclosure[open]>summary{border-bottom:1px solid var(--ip-border)}.rp-disclosure-body{padding:10px 0 13px}.rp-table{width:100%;border-collapse:collapse;font-size:11px}.rp-table td,.rp-table th{padding:8px;border-bottom:1px solid var(--ip-border);text-align:left;vertical-align:top}.rp-chip{margin:3px}.rp-chain{padding:8px 0;border-bottom:1px solid var(--ip-border);font-size:11px}.rp-roadmap{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0}.rp-roadmap .rp-chip{color:#fbbf24}.rp-form{display:grid;gap:8px;max-width:650px}.rp-form input,.rp-form textarea{background:var(--ip-bg);color:var(--ip-text);border:1px solid var(--ip-border);padding:9px;border-radius:7px}.rp-action{background:#166534;color:#fff;border:1px solid #22c55e;border-radius:7px;padding:9px;cursor:pointer}.rp-action-label{font-size:11px;color:var(--ip-dim)}.disp-CONFIRMED_OPERATION{--rp-color:#22c55e}.disp-OPERATOR_CANDIDATE{--rp-color:#60a5fa}.disp-REVIEW{--rp-color:#f59e0b}.disp-INFRASTRUCTURE{--rp-color:#a78bfa}.disp-UNRESOLVED{--rp-color:#94a3b8}.disp-REJECTED,.disp-RETIRED{--rp-color:#64748b}.disp-legacy_attribution{--rp-color:#64748b}@media(max-width:800px){.rp-tabs{grid-template-columns:1fr}.rp-grid,.rp-primary-kpis{grid-template-columns:repeat(2,1fr)}.rp-two{grid-template-columns:1fr}}
</style>
<main class="rp-wrap disp-legacy_attribution" id="rp-root">
 <div class="ip-breadcrumb"><a href="/ops-os">Mission Control</a><span class="sep">›</span><a href="/intelligence/operations">Reconciled Intelligence</a><span class="sep">›</span><span id="rp-crumb">Intelligence record</span></div>
 <div id="rp-loading" class="rp-panel">Loading reconciled intelligence record…</div>
 <div id="rp-content" hidden>
  <header class="rp-hero"><div class="rp-row"><div><div class="rp-kicker" id="rp-kind"></div><h1 class="rp-name" id="rp-name"></h1><div class="rp-hero-meta"><span class="rp-badge" id="rp-state"></span><span id="rp-size"></span><span class="rp-ready" id="rp-readiness"></span></div><p class="rp-hero-line" id="rp-reason"></p></div></div></header>
  <nav class="rp-tabs" id="rp-tabs" aria-label="Intelligence record sections"></nav>
  <section class="rp-panel" data-panel="overview"></section>
  <section class="rp-panel" data-panel="members" hidden></section>
  <section class="rp-panel" data-panel="structure" hidden></section>
  <section class="rp-panel" data-panel="evidence" hidden></section>
  <section class="rp-panel" data-panel="intelligence" hidden></section>
 </div>
</main>
<script>
(function(){
 const entity={{ entity|tojson }},esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),when=t=>t?new Date(t*1000).toLocaleString():'Not established';
 const rows=(xs,fn)=>xs&&xs.length?xs.map(fn).join(''):'<tr><td>No persisted records.</td></tr>',chips=xs=>(xs&&xs.length?xs:['None observed']).map(x=>'<span class="rp-chip">'+esc(x)+'</span>').join('');
 const disclosure=(title,body)=>'<details class="rp-disclosure"><summary>'+esc(title)+'</summary><div class="rp-disclosure-body">'+body+'</div></details>';
 const dispositionReason=d=>({CONFIRMED_OPERATION:'Canonical operator confirmation is persisted.',OPERATOR_CANDIDATE:'Independent control evidence supports analyst review.',REVIEW:'Contradictory evidence must be resolved.',INFRASTRUCTURE:'Shared infrastructure explains this population.',UNRESOLVED:'Population evidence exists, but independent operator control has not been established.',REJECTED:'Persisted evidence does not support an operator investigation.',RETIRED:'The population is retained as inactive history.'}[d]||'Reconciliation metadata is unavailable.');
 const workflowState=d=>({CONFIRMED_OPERATION:'CONFIRMED OPERATION',OPERATOR_CANDIDATE:'OPERATOR CANDIDATE',REVIEW:'READY FOR REVIEW'}[d]||'NOT ELIGIBLE');
 const evidenceItem=x=>'<details class="rp-chain"><summary><b>'+esc(x.label||x.evidence_type)+'</b> · '+esc(x.description)+'</summary><div class="rp-grid">'+[['Truth',x.truth_status],['Applicability',x.applicability],['Provenance',x.provenance],['Dependency group',String(x.dependency_group||'').replaceAll('_',' ')],['Independence',String(x.provenance_independence||'').replaceAll('_',' ')],['Observation count',x.observation_count==null?'Not applicable':x.observation_count]].map(v=>'<div class="rp-stat"><strong>'+esc(v[1])+'</strong><span class="rp-label">'+esc(v[0])+'</span></div>').join('')+'</div><p>'+esc(x.applicability_reason||'')+'</p></details>';
 function render(f){
  const rec=f.reconciliation||{},pres=f.presentation||{},disp=rec.disposition||'legacy_attribution',intel=f.intelligence||{},infra=intel.infrastructure||{},audit=intel.evidence_audit||{},perf=intel.performance||{},behaviour=intel.behaviour||{},readiness=rec.promotion_readiness||{},investigation=pres.kind==='investigation_population';
  const fullExplanation=rec.analyst_explanation||pres.investigation_summary||[dispositionReason(disp)],summary=[investigation?'This Investigation Population was reconstructed from persisted membership evidence.':'This Operation is backed by persisted canonical identity history.',dispositionReason(disp),readiness.message||'No further promotion guidance is available.'].slice(0,3);
  const metrics=[['Launches',f.launches],['Active sessions',f.active_sessions],['Clients',(f.client_wallets||[]).length],['Creators',(f.unique_creators||[]).length],['Treasuries',(f.treasuries||[]).length],['Evidence',f.evidence_completeness.score+'%'],['Significance',f.discovery_significance.score],['Maturity',f.operational_maturity.score]];
  const metricGrid='<div class="rp-grid">'+metrics.map(x=>'<div class="rp-stat"><strong>'+esc(x[1])+'</strong><span class="rp-label">'+esc(x[0])+'</span></div>').join('')+'</div>';
  const missing=rec.missing_evidence||[],contradictions=rec.contradictory_evidence||[],support=rec.supporting_evidence||[];
  let roadmap=[];if(disp==='UNRESOLVED'){roadmap.push('Independent controller evidence',...missing.map(x=>x.label||x.evidence_type))}if(disp==='REVIEW'){roadmap.push('Resolve '+contradictions.length+' contradiction'+(contradictions.length===1?'':'s'),...missing.map(x=>x.label||x.evidence_type))}if(disp==='OPERATOR_CANDIDATE'){roadmap.push(...missing.map(x=>x.label||x.evidence_type),'Analyst confirmation')}roadmap=[...new Set(roadmap)].slice(0,4);
  const confirmation=f.confirmation||{},history=confirmation.history||[];
  const historyHtml=disp==='CONFIRMED_OPERATION'?'<h3>Confirmation History</h3>'+(history.length?history.map(x=>'<div class="rp-chain">'+esc(when(x.action_at))+' · '+esc(x.action)+' · '+esc(x.action_by)+'</div>').join(''):'<div class="rp-chain">Canonical promotion is persisted in the Operations Registry.</div>'):'';
  const primary='<div class="rp-primary-kpis">'+[['Launches',f.launches],['Disposition',disp],['Promotion Readiness',workflowState(disp)]].map(x=>'<div class="rp-stat"><strong>'+esc(x[1])+'</strong><span class="rp-label">'+esc(x[0])+'</span></div>').join('')+'</div>';
  const why=disclosure('Why?',fullExplanation.map(x=>'<p>'+esc(x)+'</p>').join(''));
  const roadmapHtml=roadmap.length?'<h3>Next Evidence Required</h3><div class="rp-roadmap">'+chips(roadmap)+'</div>':(disp==='CONFIRMED_OPERATION'?'<h3>Next Step</h3><p>Monitor the confirmed operation.</p>':'');
  const launchRows=perf.launches||[],walkbackRows=(intel.timeline||[]).filter(x=>String(x.type||'').toUpperCase().includes('WALKBACK')||String(x.source||'').toLowerCase().includes('walkback'));
  const participants='<div class="rp-two"><div><h3>Clients</h3>'+chips(f.client_wallets)+'</div><div><h3>Creators</h3>'+chips(f.unique_creators)+'</div></div>';
  const launches='<table class="rp-table"><thead><tr><th>Mint</th><th>Created</th><th>Migrated</th><th>Peak market cap</th></tr></thead><tbody>'+rows(launchRows,x=>'<tr><td><a href="'+esc(x.token_href)+'">'+esc(x.mint)+'</a></td><td>'+esc(when(x.created_at))+'</td><td>'+esc(x.migrated?'Yes':'No persisted migration')+'</td><td>'+esc(x.peak_market_cap==null?'Not available':x.peak_market_cap)+'</td></tr>')+'</tbody></table>';
  const timeline='<table class="rp-table"><thead><tr><th>Time</th><th>Event</th><th>Detail</th><th>Source</th></tr></thead><tbody>'+rows(intel.timeline,e=>'<tr><td>'+esc(when(e.timestamp))+'</td><td>'+esc(e.type)+'</td><td>'+esc(e.label)+'</td><td>'+esc(e.source)+'</td></tr>')+'</tbody></table>';
  const walkback='<table class="rp-table"><thead><tr><th>Time</th><th>Result</th><th>Detail</th><th>Source</th></tr></thead><tbody>'+rows(walkbackRows,e=>'<tr><td>'+esc(when(e.timestamp))+'</td><td>'+esc(e.type)+'</td><td>'+esc(e.label)+'</td><td>'+esc(e.source)+'</td></tr>')+'</tbody></table>';
  const topology='<p>'+esc(f.dominant_topology||'Evidence accumulation incomplete')+'</p><h3>Topology variants</h3>'+chips(infra.topology_variants);
  const infrastructure='<div class="rp-two"><div><h3>Treasuries</h3>'+chips(infra.treasuries)+'<h3>Persistent clients</h3>'+chips(infra.persistent_clients)+'</div><div><h3>Known relays</h3>'+chips(infra.known_relays)+'<h3>Mechanisms</h3>'+chips(infra.mechanisms)+'</div></div>';
  const reconciliation='<div class="rp-two"><div><h3>Supporting evidence · '+esc(rec.supporting_evidence_count||0)+'</h3>'+((support.map(evidenceItem).join(''))||'<p>None recorded.</p>')+'</div><div><h3>Contradictory evidence · '+esc(rec.contradictory_evidence_count||0)+'</h3>'+((contradictions.map(evidenceItem).join(''))||'<p>None recorded.</p>')+'<h3>Missing evidence · '+esc(rec.missing_evidence_count||0)+'</h3>'+((missing.map(evidenceItem).join(''))||'<p>None recorded.</p>')+'</div></div>';
  let workflow='<h2>Promotion Readiness</h2><div class="rp-primary-kpis">'+[['Current disposition',disp],['Workflow state',workflowState(disp)],['Promotion action',pres.confirmation_permitted?'Available':'Unavailable']].map(x=>'<div class="rp-stat"><strong>'+esc(x[1])+'</strong><span class="rp-label">'+esc(x[0])+'</span></div>').join('')+'</div><p>'+esc(dispositionReason(disp))+'</p><h3>Current support</h3>'+chips(support.slice(0,4).map(x=>x.label||x.evidence_type))+roadmapHtml;
  if(disp==='UNRESOLVED')workflow+='<p class="rp-action-label">This population is not currently eligible for promotion.</p>';else if(disp==='REVIEW')workflow+='<p class="rp-action-label">Contradictions must be resolved before promotion.</p>';else if(!['OPERATOR_CANDIDATE','CONFIRMED_OPERATION'].includes(disp))workflow+='<p class="rp-action-label">No promotion workflow applies to this disposition.</p>';
  workflow+=disclosure('Promotion blockers and requirements',((readiness.blockers||[]).map(x=>'<div class="rp-chain">□ '+esc(x)+'</div>').join('')||'<p>No blockers recorded.</p>')+((readiness.requirements||[]).map(x=>'<div class="rp-chain">→ '+esc(x)+'</div>').join('')));
  if(pres.confirmation_permitted&&disp==='OPERATOR_CANDIDATE')workflow+='<h3>Review Candidate</h3><p>Reconciliation permits analyst confirmation.</p><div class="rp-form"><input id="rp-by" placeholder="Analyst"><input id="rp-reason-input" placeholder="Confirmation reason"><textarea id="rp-notes" placeholder="Notes (optional)"></textarea><button class="rp-action" id="rp-confirm">Promote to Confirmed Operation</button><div id="rp-result"></div></div>';
  workflow+=historyHtml;
  const clusters=pres.potential_operator_clusters||[],clusterHtml=clusters.map(x=>'<div class="rp-chain"><b>'+esc(x.cluster_id)+'</b> · '+esc(x.launch_count)+' launches · '+esc(x.current_disposition)+'</div>').join('')||'<p>No independently supported operator clusters identified.</p>';
  const panels={
   overview:'<h2>'+(investigation?'Investigation Summary':'Operation Summary')+'</h2><div class="rp-summary">'+summary.map(x=>'<p>'+esc(x)+'</p>').join('')+'</div>'+why+primary+roadmapHtml+historyHtml+disclosure('Population Metrics',metricGrid),
   members:'<h2>Members</h2>'+disclosure('Participants',participants)+disclosure('Launches',launches)+disclosure('Timeline',timeline),
   structure:'<h2>Structure</h2>'+disclosure('Walkback',walkback)+disclosure('Topology',topology)+disclosure('Infrastructure',infrastructure),
   evidence:workflow+disclosure('Evidence Reconciliation',reconciliation)+disclosure('Legacy Context','<p>'+esc(pres.historical_context||'Legacy classification: '+f.lifecycle_state+'. Legacy context does not override reconciliation.')+'</p>'),
   intelligence:'<h2>Intelligence</h2>'+disclosure('Behaviour','<p>Launch frequency: '+esc(behaviour.launch_frequency_per_active_day==null?'Not established':behaviour.launch_frequency_per_active_day+' per active day')+'</p>'+chips(behaviour.operational_changes))+disclosure('Statistics',metricGrid)+disclosure('Potential Operator Clusters',clusterHtml)+disclosure('Evidence Audit','<p>'+esc(audit.confidence_explanation||'See the reconciled evidence package for disposition evidence.')+'</p>')
  };
  Object.entries(panels).forEach(([k,v])=>document.querySelector('[data-panel="'+k+'"]').innerHTML=v);
  const tabs=[['overview','Overview'],['members','Members'],['structure','Structure'],['evidence','Evidence'],['intelligence','Intelligence']],aliases={participants:'members',launches:'members',timeline:'members',walkback:'structure',topology:'structure',infrastructure:'structure',reconciliation:'evidence',readiness:'evidence',legacy:'evidence',confirmation:'evidence',behaviour:'intelligence',statistics:'intelligence',clusters:'intelligence',operational:'intelligence',performance:'intelligence',comparison:'intelligence',related:'intelligence'};
  const requested=new URLSearchParams(location.search).get('tab')||location.hash.slice(1),initial=tabs.some(x=>x[0]===requested)?requested:(aliases[requested]||'overview');
  document.getElementById('rp-tabs').innerHTML=tabs.map(x=>'<button class="rp-tab '+(x[0]===initial?'active':'')+'" data-tab="'+x[0]+'">'+x[1]+'</button>').join('');
  const activate=name=>{document.querySelectorAll('.rp-tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===name));document.querySelectorAll('[data-panel]').forEach(x=>x.hidden=x.dataset.panel!==name)};activate(initial);document.querySelectorAll('.rp-tab').forEach(b=>b.onclick=()=>activate(b.dataset.tab));
  const btn=document.getElementById('rp-confirm');if(btn&&pres.confirmation_permitted&&disp==='OPERATOR_CANDIDATE')btn.onclick=()=>{btn.disabled=true;fetch('/api/ops/operations/'+encodeURIComponent(f.family_id)+'/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({confirmed_by:document.getElementById('rp-by').value,confirmation_reason:document.getElementById('rp-reason-input').value,confirmation_notes:document.getElementById('rp-notes').value})}).then(async r=>{let d=await r.json();if(!r.ok)throw Error(d.error||'Confirmation failed');location.reload()}).catch(e=>{btn.disabled=false;document.getElementById('rp-result').textContent=e.message})};
  document.title=(investigation?'Investigation Population':'Operation Profile')+' — '+(f.family_name||'Intelligence Record');document.getElementById('rp-root').className='rp-wrap disp-'+disp;document.getElementById('rp-name').textContent=pres.title||f.family_name;document.getElementById('rp-state').textContent=disp;document.getElementById('rp-kind').textContent=investigation?'Investigation Population':pres.label||'Operation';document.getElementById('rp-size').textContent=(f.launches||0)+' launches';document.getElementById('rp-readiness').textContent='Promotion Readiness · '+workflowState(disp);document.getElementById('rp-reason').textContent=dispositionReason(disp);document.getElementById('rp-crumb').textContent=pres.label||'Intelligence record';document.getElementById('rp-loading').hidden=true;document.getElementById('rp-content').hidden=false;
 }
 fetch('/api/ops/emerging-operators/'+encodeURIComponent(entity)).then(r=>r.json()).then(x=>render(x.family)).catch(e=>{document.getElementById('rp-loading').textContent='Unable to load record: '+e.message});
})();
</script>
{% endblock %}
