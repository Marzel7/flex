[program:intelligence_snapshot_scheduler]
; X67.28 — standalone snapshot-refresh scheduler for build_operational_
; intelligence()/build_pipeline_health(). Fixes: these builds previously ran
; as in-process daemon threads inside a gunicorn worker (src/ops/swr_cache.py),
; which are killed unconditionally on worker recycle (max_requests=500) before
; the ~8-9 minute `all`-window build could ever finish, so the on-disk snapshot
; never advanced. This process runs each build to completion in its OWN
; process, independent of gunicorn's worker lifecycle, and persists via the
; existing atomic write_snapshot() path (src/ops/intelligence_snapshots.py).
; Same isolation pattern as operation_scheduler above: writes ONLY snapshot
; files under database/intelligence_snapshots/, reads wt_ops_v2.db and the
; live DB read-only, touches nothing else. autostart=false — start explicitly
; after confirming behaviour (see X67.28's validation steps).
command=/Users/kevinkeaveney/anaconda3/envs/algotrader/bin/python
    -m src.core.intelligence_snapshot_scheduler --loop
directory=/Users/kevinkeaveney/Dev/claude/flex
environment=
    PYTHONPATH="/Users/kevinkeaveney/Dev/claude/flex"
autostart=true
autorestart=true
startretries=999
startsecs=5
stopwaitsecs=15
stopsignal=TERM
stdout_logfile=/Users/kevinkeaveney/Dev/claude/flex/logs/supervisor/intelligence_snapshot_scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile=/Users/kevinkeaveney/Dev/claude/flex/logs/supervisor/intelligence_snapshot_scheduler_err.log
