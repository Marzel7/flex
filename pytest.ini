[pytest]
# pytest configuration for Phase 6A tests

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Enable verbose output
addopts = -v --tb=short

# X76.3 -- auto mode so async def test_* functions run without every one
# needing an explicit @pytest.mark.asyncio (pytest-asyncio already a
# dependency; this is the first test file in the repo to need it).
asyncio_mode = auto

# Markers for test organization
markers =
    scoring: Tests for scoring model v2
    alerts: Tests for alert generation
    idempotency: Tests for idempotency guarantees
    phase4c: Tests for Phase 4C alerts
    phase5a: Tests for Phase 5A alerts
    phase5b: Tests for Phase 5B alerts
