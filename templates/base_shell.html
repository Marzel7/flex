<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FLEX{% endblock %}</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #7c3aed;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --bg-dark: linear-gradient(135deg, #0a0a0e 0%, #0d0d15 100%);
            --bg-card: rgba(30, 30, 40, 0.8);
            --bg-hover: rgba(167, 139, 250, 0.05);
            --bg-secondary: rgba(20, 20, 30, 0.9);
            --border-color: rgba(167, 139, 250, 0.3);
            --border-hover: rgba(167, 139, 250, 0.6);
            --accent-cyan: #06b6d4;
            --accent-purple: #a78bfa;
            --color-purple: #a78bfa;
            --color-cyan: #06b6d4;
            --color-green: #16a34a;
            --color-yellow: #fbbf24;
            --color-critical: #ef4444;
            --color-high: #f97316;
            --color-medium: #eab308;
            --color-low: #22c55e;
            --blue: #3b82f6;
        }

        html {
            height: 100%;
            background: var(--bg-dark);
            background-attachment: fixed;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: transparent;
            color: var(--text-primary);
            margin: 0;
            min-height: 100vh;
        }

        /* ── Shell layout ─────────────────────────────────── */
        .container {
            max-width: 100%;
            margin: 0;
            padding: 30px 30px 30px 196px;
            width: 100%;
        }

        /* ── Sidebar ──────────────────────────────────────── */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 180px;
            height: 100vh;
            background: rgba(20, 20, 30, 0.9);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            z-index: 100;
            overflow-y: auto;
        }

        .sidebar-logo {
            padding: 0 16px 20px;
            border-bottom: 1px solid var(--border-color);
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-cyan);
            letter-spacing: 1px;
        }

        .sidebar-nav { flex: 1; }

        .sidebar-section {
            padding: 8px 0 4px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .sidebar-section-label {
            padding: 6px 16px 2px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            color: rgba(156,163,175,0.5);
            letter-spacing: 0.08em;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 16px;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 6px;
            margin: 0 8px;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            transition: background 0.15s, color 0.15s;
            border: none;
            background: none;
            width: calc(100% - 16px);
            text-align: left;
        }

        .sidebar-item:hover {
            background: rgba(255,255,255,0.07);
            color: var(--text-primary);
        }

        .sidebar-item.active {
            background: rgba(6, 182, 212, 0.15);
            color: var(--accent-cyan);
            border-left: 3px solid var(--accent-cyan);
            padding-left: 13px;
        }

        .sidebar-item.flex-link { color: #8b5cf6; }
        .sidebar-item.flex-link:hover {
            background: rgba(139, 92, 246, 0.1);
            color: #a78bfa;
        }

        /* ── Typography ───────────────────────────────────── */
        h1 { color: var(--color-purple); margin-bottom: 10px; font-size: 1.75rem; font-weight: 700; }
        h2 { color: var(--color-purple); margin-bottom: 20px; }
        h5 { color: var(--text-primary); font-size: 0.95rem; font-weight: 600; margin: 0; }

        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .page-header {
            margin-bottom: 24px;
        }

        .page-header h1 {
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .page-header .subtitle {
            margin-bottom: 0;
        }

        code {
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 11px;
            color: var(--accent-purple);
            background: rgba(167, 139, 250, 0.08);
            padding: 1px 4px;
            border-radius: 3px;
        }

        /* ── Cards ────────────────────────────────────────── */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }

        .card-header {
            background: rgba(0, 0, 0, 0.25);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 8px 8px 0 0;
        }

        .card-body {
            padding: 16px;
            background: transparent;
        }

        /* ── Stat cards ───────────────────────────────────── */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 18px 20px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            line-height: 1;
            color: var(--text-primary);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        /* ── Tables ───────────────────────────────────────── */
        table {
            width: 100%;
            border-collapse: collapse;
            background: transparent;
            font-size: 13px;
        }

        thead {
            border-bottom: 2px solid var(--border-color);
        }

        th {
            padding: 12px 15px;
            text-align: left;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            background: rgba(255, 255, 255, 0.02);
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(167, 139, 250, 0.1);
            font-size: 13px;
            color: var(--text-secondary);
            vertical-align: middle;
        }

        tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: var(--bg-hover); }

        /* ── Badges ───────────────────────────────────────── */
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-critical { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
        .badge-high     { background: rgba(249, 115, 22, 0.2); color: #fed7aa; }
        .badge-watch    { background: rgba(234, 179, 8, 0.2);  color: #fde047; }
        .badge-low      { background: rgba(132, 204, 22, 0.2); color: #bef264; }

        /* ── Alerts ───────────────────────────────────────── */
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 1rem;
            font-size: 13px;
        }

        .alert-danger  { background: rgba(239, 68, 68, 0.1);  color: #fca5a5;  border-color: rgba(239, 68, 68, 0.3); }
        .alert-warning { background: rgba(249, 115, 22, 0.1); color: #fed7aa;  border-color: rgba(249, 115, 22, 0.3); }
        .alert-info    { background: rgba(59, 130, 246, 0.1); color: #bfdbfe;  border-color: rgba(59, 130, 246, 0.3); }
        .alert-success { background: rgba(34, 197, 94, 0.1);  color: #86efac;  border-color: rgba(34, 197, 94, 0.3); }

        /* ── Loading ──────────────────────────────────────── */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .spinner-border {
            display: inline-block;
            width: 2rem;
            height: 2rem;
            border: 3px solid rgba(59, 130, 246, 0.2);
            border-right-color: var(--accent-cyan);
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Forms ────────────────────────────────────────── */
        .form-control, .form-select {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 13px;
            width: 100%;
        }

        .form-control:focus, .form-select:focus {
            outline: none;
            background: rgba(0, 0, 0, 0.3);
            border-color: var(--accent-purple);
            color: var(--text-primary);
        }

        /* ── Buttons ──────────────────────────────────────── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background: none;
            color: var(--text-secondary);
            transition: background 0.15s, color 0.15s;
        }

        .btn:hover { color: var(--text-primary); }

        .btn-sm { padding: 5px 10px; font-size: 12px; }

        .btn-primary {
            background: rgba(79, 111, 255, 0.16);
            border-color: rgba(79, 111, 255, 0.35);
            color: #dbe4ff;
        }

        .btn-primary:hover { background: rgba(79, 111, 255, 0.28); color: #fff; }

        .btn-secondary { border-color: var(--border-color); color: var(--text-secondary); }
        .btn-secondary:hover { background: rgba(255,255,255,0.06); color: var(--text-primary); }

        /* ── Misc ─────────────────────────────────────────── */
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--color-cyan);
            text-decoration: none;
            font-size: 13px;
        }

        .back-link:hover { color: var(--color-purple); text-decoration: underline; }

        /* ── Responsive ───────────────────────────────────── */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                padding: 0;
            }

            .container { padding: 16px; }
            .stats-row { grid-template-columns: 1fr 1fr; }
        }

        {% block extra_styles %}{% endblock %}
    </style>

    {% block head_extra %}{% endblock %}
</head>
<body>
    {% include "partials/sidebar.html" %}

    <div class="container">
        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
