[program:infra_sync_scheduler]
; X78.8 — standalone infrastructure-wallet sync scheduler. Fixes:
; sync_infra_wallets() (three full SELECT DISTINCT scans of token_analysis,
; ~1.4-1.6M rows each, ~48s+ combined, worse under concurrent DB load) was
; called synchronously from 15+ sites across the codebase, including
; RiskScoringBuilder.score_creator_now() -- meaning a single-creator risk
; score could occasionally become responsible for a full ecosystem-wide
; infra rebuild. Caller census (X78.8) confirmed every consumer already
; tolerates last-successful-state (the underlying source is append-only).
; This process runs sync_infra_wallets() on its own fixed cadence,
; independent of any scoring/job lifecycle, and persists staleness/health
; via infra_wallets_sync_status. Same isolation pattern as
; intelligence_snapshot_scheduler/operation_scheduler above: single-flight
; via PID-liveness-checked lock file, writes only infra_wallets +
; infra_wallets_sync_status, reads the live DB. autostart=false — start
; explicitly after confirming behaviour (see X78.8's validation steps).
command=/Users/kevinkeaveney/anaconda3/envs/algotrader/bin/python
    -m src.core.infra_sync_scheduler --loop
directory=/Users/kevinkeaveney/Dev/claude/flex
