<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FLEX{% endblock %}</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            /* Backgrounds */
            --bg-dark: #0b0f14;
            --bg-card: #12171f;
            --bg-secondary: #0f141b;
            --bg-hover: rgba(255, 255, 255, 0.04);

            /* Text */
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;

            /* Accents */
            --accent-primary: #3b82f6;
            --accent-cyan: #22d3ee;
            --accent-purple: #8b5cf6;

            /* Data colors */
            --color-green: #22c55e;
            --color-yellow: #f59e0b;
            --color-orange: #f97316;
            --color-red: #ef4444;

            /* Legacy aliases (keep for child templates that reference these) */
            --color-low: #22c55e;
            --color-medium: #f59e0b;
            --color-high: #f97316;
            --color-critical: #ef4444;
            --color-purple: #8b5cf6;
            --color-cyan: #22d3ee;
            --blue: #3b82f6;

            /* Borders */
            --border-color: rgba(255, 255, 255, 0.06);
            --border-strong: rgba(255, 255, 255, 0.12);
        }

        html {
            background: var(--bg-dark);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: transparent;
            color: var(--text-primary);
            margin: 0;
            min-height: 100vh;
        }

        /* ── Shell layout ─────────────────────────────────── */
        .container {
            max-width: 100%;
            margin: 0;
            padding: 30px 30px 30px 196px;
            width: 100%;
        }

        /* ── Sidebar ──────────────────────────────────────── */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 180px;
            height: 100vh;
            background: #0a0e13;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            z-index: 100;
            overflow-y: auto;
        }

        .sidebar-logo {
            padding: 0 16px 20px;
            border-bottom: 1px solid var(--border-color);
            font-size: 16px;
            font-weight: 700;
            color: #06b6d4;
            letter-spacing: 1px;
        }

        .sidebar-nav { flex: 1; }

        .sidebar-section {
            padding: 8px 0 4px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .sidebar-section-label {
            padding: 6px 16px 2px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            color: rgba(139, 148, 158, 0.55);
            letter-spacing: 0.08em;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 16px;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 6px;
            margin: 0 8px;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            transition: background 0.15s, color 0.15s;
            border: none;
            background: none;
            width: calc(100% - 16px);
            text-align: left;
        }

        .sidebar-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .sidebar-item.active {
            background: rgba(6, 182, 212, 0.15);
            color: #06b6d4;
            border-left: 3px solid #06b6d4;
            padding-left: 13px;
        }

        .sidebar-item.flex-link { color: #8b5cf6; }
        .sidebar-item.flex-link:hover {
            background: rgba(139, 92, 246, 0.1);
            color: #a78bfa;
        }

        /* ── Typography ───────────────────────────────────── */
        h1 { color: var(--text-primary); margin-bottom: 10px; font-size: 22px; font-weight: 700; }
        h2 { color: var(--text-primary); margin-bottom: 20px; }
        h5 { color: var(--text-primary); font-size: 0.95rem; font-weight: 600; margin: 0; }

        .subtitle {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 20px;
        }

        .page-header {
            margin-bottom: 24px;
        }

        .page-header h1 {
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .page-header .subtitle {
            margin-bottom: 0;
        }

        a {
            color: var(--accent-cyan);
            text-decoration: none;
        }

        a:hover {
            color: var(--accent-primary);
        }

        code {
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 11px;
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.04);
            padding: 1px 4px;
            border-radius: 3px;
        }

        /* ── Cards ────────────────────────────────────────── */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 1.5rem;
            transition: all 0.15s ease;
        }

        .card:hover {
            border-color: var(--border-strong);
        }

        .card-header {
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 10px 10px 0 0;
        }

        .card-body {
            padding: 16px;
            background: transparent;
        }

        /* ── Stat cards ───────────────────────────────────── */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 18px 20px;
            transition: border-color 0.15s ease;
        }

        .stat-card:hover {
            border-color: var(--border-strong);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            line-height: 1;
            color: var(--text-primary);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        /* ── Tables ───────────────────────────────────────── */
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
        }

        thead {
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border-color);
            box-shadow: inset 0 -1px 0 var(--border-color);
        }

        th {
            padding: 10px 14px;
            text-align: left;
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #6b7280;
            font-weight: 600;
        }

        td {
            padding: 9px 14px;
            font-size: 13px;
            color: var(--text-primary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            vertical-align: middle;
        }

        tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: rgba(34, 211, 238, 0.04); }

        /* ── Badges ───────────────────────────────────────── */
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(34, 211, 238, 0.1);
            color: #22d3ee;
            border: 1px solid rgba(34, 211, 238, 0.25);
        }

        .badge-critical { background: rgba(239, 68, 68, 0.15);  color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
        .badge-high     { background: rgba(249, 115, 22, 0.15); color: #fed7aa; border: 1px solid rgba(249, 115, 22, 0.3); }
        .badge-watch    { background: rgba(234, 179, 8, 0.15);  color: #fde047; border: 1px solid rgba(234, 179, 8, 0.3); }
        .badge-low      { background: rgba(34, 197, 94, 0.15);  color: #86efac; border: 1px solid rgba(34, 197, 94, 0.3); }

        /* ── Alerts ───────────────────────────────────────── */
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 1rem;
            font-size: 13px;
        }

        .alert-danger  { background: rgba(239, 68, 68, 0.1);  color: #fca5a5;  border-color: rgba(239, 68, 68, 0.3); }
        .alert-warning { background: rgba(249, 115, 22, 0.1); color: #fed7aa;  border-color: rgba(249, 115, 22, 0.3); }
        .alert-info    { background: rgba(59, 130, 246, 0.1); color: #bfdbfe;  border-color: rgba(59, 130, 246, 0.3); }
        .alert-success { background: rgba(34, 197, 94, 0.1);  color: #86efac;  border-color: rgba(34, 197, 94, 0.3); }

        /* ── Loading ──────────────────────────────────────── */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .spinner-border {
            display: inline-block;
            width: 2rem;
            height: 2rem;
            border: 3px solid rgba(59, 130, 246, 0.2);
            border-right-color: var(--accent-cyan);
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Forms ────────────────────────────────────────── */
        .form-control, .form-select {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 13px;
            width: 100%;
        }

        .form-control:focus, .form-select:focus {
            outline: none;
            background: rgba(0, 0, 0, 0.3);
            border-color: var(--accent-purple);
            color: var(--text-primary);
        }

        /* ── Buttons ──────────────────────────────────────── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background: none;
            color: var(--text-secondary);
            transition: background 0.15s, color 0.15s;
        }

        .btn:hover { color: var(--text-primary); }

        .btn-sm { padding: 5px 10px; font-size: 12px; }

        .btn-primary {
            background: rgba(59, 130, 246, 0.18);
            border-color: rgba(59, 130, 246, 0.4);
            color: #dbeafe;
        }

        .btn-primary:hover { background: rgba(59, 130, 246, 0.28); color: #ffffff; }

        .btn-secondary { border-color: var(--border-color); color: var(--text-secondary); }
        .btn-secondary:hover { background: rgba(255,255,255,0.06); color: var(--text-primary); }

        /* ── Misc ─────────────────────────────────────────── */
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--color-cyan);
            text-decoration: none;
            font-size: 13px;
        }

        .back-link:hover { color: var(--color-purple); text-decoration: underline; }

        /* ── Responsive ───────────────────────────────────── */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                padding: 0;
            }

            .container { padding: 16px; }
            .stats-row { grid-template-columns: 1fr 1fr; }
        }

        /* ── Terminal typography ──────────────────────────── */
        .stat-value,
        .value,
        .number {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            letter-spacing: 0.02em;
        }

        .mint,
        .address {
            font-family: ui-monospace, SFMono-Regular, monospace;
            font-size: 12px;
            color: #9ca3af;
        }

        .price,
        .live-price {
            color: #22d3ee;
            font-weight: 600;
        }

        .live-price {
            text-shadow: 0 0 6px rgba(34, 211, 238, 0.3);
        }

        .market-cap,
        .peak {
            color: #cbd5f5;
        }

        /* Numeric columns right-aligned */
        td:nth-child(n+5),
        th:nth-child(n+5) {
            text-align: right;
        }

        /* ── Scrollbars ───────────────────────────────────── */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.08); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.14); }

        {% block extra_styles %}{% endblock %}
    </style>

    {% block head_extra %}{% endblock %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard-theme.css') }}">
</head>
<body>
    {% include "partials/sidebar.html" %}

    <div class="container">
        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
