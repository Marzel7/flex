    -m src.core.operation_scheduler --loop
directory=/Users/kevinkeaveney/Dev/claude/flex
environment=
    PYTHONPATH="/Users/kevinkeaveney/Dev/claude/flex",
    OPS_INTAKE_INTERVAL_SEC="900",
    OPS_FORWARD_INTERVAL_SEC="180",
    OPS_INTAKE_MAX_RPC="120",
    OPS_FORWARD_MAX_RPC="180"
autostart=false
autorestart=true
startretries=999
startsecs=5
stopwaitsecs=15
