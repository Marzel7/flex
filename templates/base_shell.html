<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FLEX{% endblock %}</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            /* Backgrounds */
            --bg-dark: #0b0f14;
            --bg-card: #12171f;
            --bg-secondary: #0f141b;
            --bg-hover: rgba(255, 255, 255, 0.04);

            /* Text */
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;

            /* Accents */
            --accent-primary: #3b82f6;
            --accent-cyan: #22d3ee;
            --accent-purple: #8b5cf6;

            /* Data colors */
            --color-green: #22c55e;
            --color-yellow: #f59e0b;
            --color-orange: #f97316;
            --color-red: #ef4444;

            /* Legacy aliases (keep for child templates that reference these) */
            --color-low: #22c55e;
            --color-medium: #f59e0b;
            --color-high: #f97316;
            --color-critical: #ef4444;
            --color-purple: #8b5cf6;
            --color-cyan: #22d3ee;
            --blue: #3b82f6;

            /* Borders */
            --border-color: rgba(255, 255, 255, 0.06);
            --border-strong: rgba(255, 255, 255, 0.12);
        }

        html {
            background: var(--bg-dark);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: transparent;
            color: var(--text-primary);
            margin: 0;
            min-height: 100vh;
        }

        /* ── Shell layout ─────────────────────────────────── */
        .container {
            max-width: 100%;
            margin: 0;
            padding: 30px 30px 30px 196px;
            width: 100%;
        }

        /* ── Sidebar ──────────────────────────────────────── */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 180px;
            height: 100vh;
            background:
                linear-gradient(180deg, rgba(5,7,9,0.98), rgba(8,11,16,0.98)),
                #050709;
            border-right: 1px solid rgba(255,255,255,0.07);
            display: flex;
            flex-direction: column;
            padding: 0;
            z-index: 100;
            overflow-y: auto;
            box-shadow: inset -1px 0 0 rgba(255,255,255,0.025);
        }

        .sidebar-logo {
            height: 64px;
            padding: 14px 16px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
            background: rgba(255,255,255,0.012);
        }

        .sidebar-logo-main {
            font-size: 12px;
            font-weight: 900;
            color: #22d3ee;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            line-height: 1;
        }

        .sidebar-logo-sub {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 8.5px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(122,136,153,0.72);
            white-space: nowrap;
        }

        .sidebar-status-dot {
            width: 5px;
            height: 5px;
            border-radius: 999px;
            background: #22c55e;
            box-shadow: 0 0 9px rgba(34,197,94,.55);
            flex: 0 0 auto;
        }

        .sidebar-nav { flex: 1; padding: 8px 0 14px; }

        .sidebar-section {
            padding: 9px 0 7px;
            border-bottom: 1px solid rgba(255,255,255,0.045);
        }

        .sidebar-section-label {
            padding: 7px 16px 6px;
            font-size: 8px;
            line-height: 1;
            font-weight: 800;
            text-transform: uppercase;
            color: rgba(122,136,153,0.56);
            letter-spacing: 0.15em;
        }

        .sidebar-item {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px 8px 16px;
            color: rgba(208,216,232,0.58);
            cursor: pointer;
            border-radius: 4px;
            margin: 1px 8px;
            font-size: 11px;
            line-height: 1.15;
            font-weight: 650;
            letter-spacing: 0.015em;
            text-decoration: none;
            transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
            border: 1px solid transparent;
            background: none;
            width: calc(100% - 16px);
            text-align: left;
        }

        .sidebar-item:hover {
            background: rgba(255,255,255,0.028);
            color: rgba(237,242,247,0.92);
            border-color: rgba(255,255,255,0.04);
        }

        .sidebar-item.active {
            background: rgba(34,211,238,0.075);
            color: #22d3ee;
            border-color: rgba(34,211,238,0.16);
            padding-left: 16px;
        }

        .sidebar-item.active::before {
            content: '';
            position: absolute;
            left: -8px;
            top: 7px;
            bottom: 7px;
            width: 3px;
            border-radius: 0 2px 2px 0;
            background: #22d3ee;
            box-shadow: 0 0 10px rgba(34,211,238,.55);
        }

        .sidebar-item[href="/watchtower"] {
            color: #bc8cff;
        }
        .sidebar-item[href="/watchtower"]:hover,
        .sidebar-item[href="/watchtower"].active {
            background: rgba(188,140,255,0.08);
            color: #d6bcff;
            border-color: rgba(188,140,255,0.18);
        }
        .sidebar-item[href="/watchtower"].active::before {
            background: #bc8cff;
            box-shadow: 0 0 10px rgba(188,140,255,.55);
        }

        .sidebar-item.flex-link { color: #8b5cf6; }
        .sidebar-item.flex-link:hover {
            background: rgba(139, 92, 246, 0.1);
            color: #a78bfa;
        }


        /* ═══════════════════════════════════════════════════════════════
           FLEX UNIFIED COCKPIT DESIGN SYSTEM
           Global Watchtower-style visual language for every intelligence page.
           Page templates can still add specialized layouts, but the shell now
           owns the base color, font, density, tables, cards, controls, modals.
           ═══════════════════════════════════════════════════════════════ */
        :root {
            --bg-dark: #050709;
            --bg-card: #0d1117;
            --bg-secondary: #080b10;
            --bg-hover: rgba(255,255,255,0.028);
            --text-primary: #d0d8e8;
            --text-secondary: #7a8899;
            --text-muted: #4a5568;
            --accent-primary: #3b82f6;
            --accent-cyan: #22d3ee;
            --accent-purple: #a78bfa;
            --border-color: rgba(255,255,255,0.07);
            --border-strong: rgba(255,255,255,0.13);
            --font-ui: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
            --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', 'Cascadia Code', ui-monospace, monospace;
        }

        html, body {
            background: #050709 !important;
        }

        body {
            font-family: var(--font-ui);
            color: var(--text-primary);
            font-size: 12px;
            letter-spacing: 0.005em;
        }

        .container {
            background:
                radial-gradient(circle at 16% 0%, rgba(34,211,238,.035), transparent 30%),
                radial-gradient(circle at 82% 6%, rgba(167,139,250,.03), transparent 26%),
                #050709;
            min-height: 100vh;
        }

        .page-header,
        .header {
            background: linear-gradient(180deg, rgba(13,17,23,.92), rgba(8,11,16,.92)) !important;
            border: 1px solid rgba(255,255,255,0.07) !important;
            border-left: 3px solid rgba(34,211,238,0.72) !important;
            border-radius: 8px !important;
            padding: 16px 18px !important;
            margin-bottom: 16px !important;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.025);
        }

        h1, h2, h3, h4, h5 {
            color: #edf2f7;
            letter-spacing: 0.01em;
        }
        h1 { font-size: 20px; font-weight: 800; }
        h2 { font-size: 16px; font-weight: 800; }
        h3 { font-size: 13px; font-weight: 800; }

        .subtitle,
        .text-muted,
        small {
            color: var(--text-secondary) !important;
        }

        a { color: var(--accent-cyan); }
        a:hover { color: #67e8f9; }

        code, pre,
        .mint, .address,
        .stat-value, .value, .number,
        .price, .live-price,
        td.numeric, th.numeric {
            font-family: var(--font-mono) !important;
        }

        .card,
        .panel,
        .widget,
        .metric-card,
        .stat-card,
        .tokens-table-wrap,
        .table-wrap,
        .section-card {
            background: linear-gradient(180deg, rgba(13,17,23,.92), rgba(8,11,16,.92)) !important;
            border: 1px solid rgba(255,255,255,0.07) !important;
            border-radius: 8px !important;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.025);
        }

        .card-header,
        .panel-header,
        .section-header,
        .table-header {
            background: rgba(255,255,255,0.018) !important;
            border-bottom: 1px solid rgba(255,255,255,0.06) !important;
            color: var(--text-secondary) !important;
            font-size: 9px !important;
            font-weight: 800 !important;
            letter-spacing: .12em !important;
            text-transform: uppercase !important;
        }

        table,
        .tokens-table {
            background: rgba(13,17,23,.88) !important;
            border-color: rgba(255,255,255,0.07) !important;
            color: var(--text-primary);
        }

        thead,
        .tokens-table thead {
            background: rgba(255,255,255,.018) !important;
            border-bottom: 1px solid rgba(255,255,255,0.07) !important;
            box-shadow: none !important;
        }

        th,
        .tokens-table thead th {
            color: rgba(122,136,153,.78) !important;
            font-size: 8.5px !important;
            font-weight: 800 !important;
            letter-spacing: .12em !important;
            text-transform: uppercase !important;
            padding: 8px 10px !important;
            background: transparent !important;
        }

        td,
        .tokens-table td {
            color: var(--text-secondary) !important;
            font-size: 11px !important;
            border-bottom: 1px solid rgba(255,255,255,0.04) !important;
            padding: 7px 10px !important;
        }

        tbody tr:hover,
        .tokens-table tbody tr:hover {
            background: rgba(255,255,255,0.026) !important;
        }

        .badge,
        .risk-score,
        .creator-tag,
        .network-badge,
        .shared-badge,
        .sig-badge,
        .tag,
        .infra-tag,
        .cex-badge {
            border-radius: 3px !important;
            font-size: 9px !important;
            font-weight: 800 !important;
            letter-spacing: .055em !important;
            text-transform: uppercase;
        }

        .btn,
        button,
        .action-button {
            border-radius: 5px !important;
            font-size: 11px !important;
            font-weight: 750 !important;
            letter-spacing: .02em;
        }

        .form-control,
        .form-select,
        input,
        select,
        textarea {
            background: rgba(5,7,9,.72) !important;
            border: 1px solid rgba(255,255,255,0.08) !important;
            color: var(--text-primary) !important;
            border-radius: 5px !important;
        }

        .form-control:focus,
        .form-select:focus,
        input:focus,
        select:focus,
        textarea:focus {
            outline: none !important;
            border-color: rgba(34,211,238,.42) !important;
            box-shadow: 0 0 0 2px rgba(34,211,238,.08) !important;
        }

        .modal-content,
        .drawer,
        .side-panel {
            background: #0d1117 !important;
            border: 1px solid rgba(255,255,255,0.12) !important;
            border-radius: 8px !important;
            color: var(--text-primary) !important;
            box-shadow: 0 24px 80px rgba(0,0,0,.48) !important;
        }

        .loading,
        .no-data,
        .empty-state {
            color: var(--text-muted) !important;
            font-size: 11px !important;
        }

        .stat-label,
        .metric label {
            color: var(--text-muted) !important;
            font-size: 8.5px !important;
            font-weight: 800 !important;
            letter-spacing: .12em !important;
            text-transform: uppercase !important;
        }

        .stat-value,
        .metric span {
            color: #edf2f7 !important;
            font-weight: 800 !important;
        }

        ::selection {
            background: rgba(34,211,238,.18);
            color: #edf2f7;
        }

        /* ── Typography ───────────────────────────────────── */
        h1 { color: var(--text-primary); margin-bottom: 10px; font-size: 22px; font-weight: 700; }
        h2 { color: var(--text-primary); margin-bottom: 20px; }
        h5 { color: var(--text-primary); font-size: 0.95rem; font-weight: 600; margin: 0; }

        .subtitle {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 20px;
        }

        .page-header {
            margin-bottom: 24px;
        }

        .page-header h1 {
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .page-header .subtitle {
            margin-bottom: 0;
        }

        a {
            color: var(--accent-cyan);
            text-decoration: none;
        }

        a:hover {
            color: var(--accent-primary);
        }

        code {
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 11px;
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.04);
            padding: 1px 4px;
            border-radius: 3px;
        }

        /* ── Cards ────────────────────────────────────────── */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 1.5rem;
            transition: all 0.15s ease;
        }

        .card:hover {
            border-color: var(--border-strong);
        }

        .card-header {
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 10px 10px 0 0;
        }

        .card-body {
            padding: 16px;
            background: transparent;
        }

        /* ── Stat cards ───────────────────────────────────── */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 18px 20px;
            transition: border-color 0.15s ease;
        }

        .stat-card:hover {
            border-color: var(--border-strong);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            line-height: 1;
            color: var(--text-primary);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        /* ── Tables ───────────────────────────────────────── */
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
        }

        thead {
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border-color);
            box-shadow: inset 0 -1px 0 var(--border-color);
        }

        th {
            padding: 10px 14px;
            text-align: left;
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #6b7280;
            font-weight: 600;
        }

        td {
            padding: 9px 14px;
            font-size: 13px;
            color: var(--text-primary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            vertical-align: middle;
        }

        tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: rgba(34, 211, 238, 0.04); }

        /* ── Badges ───────────────────────────────────────── */
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(34, 211, 238, 0.1);
            color: #22d3ee;
            border: 1px solid rgba(34, 211, 238, 0.25);
        }

        .badge-critical { background: rgba(239, 68, 68, 0.15);  color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
        .badge-high     { background: rgba(249, 115, 22, 0.15); color: #fed7aa; border: 1px solid rgba(249, 115, 22, 0.3); }
        .badge-watch    { background: rgba(234, 179, 8, 0.15);  color: #fde047; border: 1px solid rgba(234, 179, 8, 0.3); }
        .badge-low      { background: rgba(34, 197, 94, 0.15);  color: #86efac; border: 1px solid rgba(34, 197, 94, 0.3); }

        /* ── Alerts ───────────────────────────────────────── */
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 1rem;
            font-size: 13px;
        }

        .alert-danger  { background: rgba(239, 68, 68, 0.1);  color: #fca5a5;  border-color: rgba(239, 68, 68, 0.3); }
        .alert-warning { background: rgba(249, 115, 22, 0.1); color: #fed7aa;  border-color: rgba(249, 115, 22, 0.3); }
        .alert-info    { background: rgba(59, 130, 246, 0.1); color: #bfdbfe;  border-color: rgba(59, 130, 246, 0.3); }
        .alert-success { background: rgba(34, 197, 94, 0.1);  color: #86efac;  border-color: rgba(34, 197, 94, 0.3); }

        /* ── Loading ──────────────────────────────────────── */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .spinner-border {
            display: inline-block;
            width: 2rem;
            height: 2rem;
            border: 3px solid rgba(59, 130, 246, 0.2);
            border-right-color: var(--accent-cyan);
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Forms ────────────────────────────────────────── */
        .form-control, .form-select {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 13px;
            width: 100%;
        }

        .form-control:focus, .form-select:focus {
            outline: none;
            background: rgba(0, 0, 0, 0.3);
            border-color: var(--accent-purple);
            color: var(--text-primary);
        }

        /* ── Buttons ──────────────────────────────────────── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background: none;
            color: var(--text-secondary);
            transition: background 0.15s, color 0.15s;
        }

        .btn:hover { color: var(--text-primary); }

        .btn-sm { padding: 5px 10px; font-size: 12px; }

        .btn-primary {
            background: rgba(59, 130, 246, 0.18);
            border-color: rgba(59, 130, 246, 0.4);
            color: #dbeafe;
        }

        .btn-primary:hover { background: rgba(59, 130, 246, 0.28); color: #ffffff; }

        .btn-secondary { border-color: var(--border-color); color: var(--text-secondary); }
        .btn-secondary:hover { background: rgba(255,255,255,0.06); color: var(--text-primary); }

        /* ── Misc ─────────────────────────────────────────── */
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--color-cyan);
            text-decoration: none;
            font-size: 13px;
        }

        .back-link:hover { color: var(--color-purple); text-decoration: underline; }

        /* ── Responsive ───────────────────────────────────── */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                padding: 0;
            }

            .container { padding: 16px; }
            .stats-row { grid-template-columns: 1fr 1fr; }
        }

        /* ── Terminal typography ──────────────────────────── */
        .stat-value,
        .value,
        .number {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            letter-spacing: 0.02em;
        }

        .mint,
        .address {
            font-family: ui-monospace, SFMono-Regular, monospace;
            font-size: 12px;
            color: #9ca3af;
        }

        .price,
        .live-price {
            color: #22d3ee;
            font-weight: 600;
        }

        .live-price {
            text-shadow: 0 0 6px rgba(34, 211, 238, 0.3);
        }

        .market-cap,
        .peak {
            color: #cbd5f5;
        }

        /* Numeric columns right-aligned */
        td:nth-child(n+5),
        th:nth-child(n+5) {
            text-align: right;
        }

        /* ── Scrollbars ───────────────────────────────────── */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.08); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.14); }

        {% block extra_styles %}{% endblock %}
    </style>

    {% block head_extra %}{% endblock %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard-theme.css') }}">
</head>
<body>
    {% include "partials/sidebar.html" %}

    <div class="container">
        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
