{% extends "base_shell.html" %}
{% block title %}Operation Profile — Intelligence{% endblock %}
{% block content %}
<style>
.op-wrap{max-width:1500px;margin:auto;padding:24px}.op-hero,.op-panel,.op-node,.op-stat{border:1px solid var(--ip-border);background:var(--ip-card);border-radius:10px}.op-hero{padding:22px;border-left:5px solid var(--state-color,#64748b)}.op-title-row{display:flex;justify-content:space-between;gap:15px;align-items:start}.op-name{font-size:30px;font-weight:800}.op-badge{color:var(--state-color);border:1px solid var(--state-color);border-radius:14px;padding:5px 9px;font-size:10px}.op-tabs{display:flex;gap:6px;overflow:auto;margin:18px 0}.op-tab{border:1px solid var(--ip-border);background:transparent;color:var(--ip-sec);padding:8px 11px;border-radius:8px;cursor:pointer;white-space:nowrap}.op-tab.active{color:#fff;border-color:var(--state-color);background:color-mix(in srgb,var(--state-color) 12%,transparent)}.op-panel{padding:18px;margin:12px 0}.op-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.op-stat{padding:14px}.op-stat strong{display:block;font-size:23px}.op-label,.op-kicker{font-size:9px;color:var(--ip-dim);text-transform:uppercase;letter-spacing:.09em}.op-two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.op-topology{display:flex;align-items:center;gap:10px;margin:17px 0}.op-node{flex:1;padding:22px 10px;text-align:center;border-top:3px solid var(--state-color)}.op-arrow{font-size:20px;color:var(--state-color)}.op-chip{display:inline-block;font-size:9px;padding:4px 7px;border:1px solid var(--ip-border);border-radius:12px;margin:3px}.op-chip.warn{color:#fbbf24}.op-table{width:100%;border-collapse:collapse;font-size:11px}.op-table td,.op-table th{padding:9px;border-bottom:1px solid var(--ip-border);text-align:left;vertical-align:top}.op-list{font:11px monospace;overflow-wrap:anywhere}.op-panel[hidden]{display:none}.state-CONFIRMED{--state-color:#22c55e}.state-EMERGING,.state-ESTABLISHED{--state-color:#f59e0b}.state-CANDIDATE,.state-SIGNIFICANT_ACTIVE{--state-color:#60a5fa}.state-DORMANT{--state-color:#9ca3af}.state-RETIRED{--state-color:#4b5563}.state-BACKGROUND{--state-color:#64748b}.op-alert{color:#f87171}.op-ok{color:#4ade80}@media(max-width:800px){.op-grid{grid-template-columns:repeat(2,1fr)}.op-two{grid-template-columns:1fr}.op-topology{flex-direction:column}.op-arrow{transform:rotate(90deg)}}
</style>
<main class="op-wrap state-BACKGROUND" id="op-root">
 <div class="ip-breadcrumb"><a href="/ops-os">Mission Control</a><span class="sep">›</span><a href="/intelligence/operations">Operation Discovery</a><span class="sep">›</span><span>Operation Profile</span></div>
 <div id="op-loading" class="op-panel">Loading operation profile…</div>
 <div id="op-content" hidden>
  <header class="op-hero"><div class="op-title-row"><div><div class="op-kicker">Operation profile</div><h1 class="op-name" id="op-name"></h1><p id="op-subtitle"></p></div><span class="op-badge" id="op-state"></span></div></header>
  <nav class="op-tabs" aria-label="Operation profile sections" id="op-tabs"></nav>
  <section class="op-panel" data-panel="overview"></section>
  <section class="op-panel" data-panel="topology" hidden></section>
  <section class="op-panel" data-panel="infrastructure" hidden></section>
  <section class="op-panel" data-panel="participants" hidden></section>
  <section class="op-panel" data-panel="launches" hidden></section>
  <section class="op-panel" data-panel="timeline" hidden></section>
  <section class="op-panel" data-panel="behaviour" hidden></section>
  <section class="op-panel" data-panel="performance" hidden></section>
  <section class="op-panel" data-panel="evidence" hidden></section>
  <section class="op-panel" data-panel="operational" hidden></section>
  <section class="op-panel" data-panel="statistics" hidden></section>
  <section class="op-panel" data-panel="comparison" hidden></section>
  <section class="op-panel" data-panel="related" hidden></section>
 </div>
</main>
<script>
(function(){
 const entity={{ entity|tojson }},esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),when=t=>t?new Date(t*1000).toLocaleString():'Not established';
 const chip=(x,cl='')=>'<span class="op-chip '+cl+'">'+esc(x)+'</span>',chips=(xs,cl='')=>(xs&&xs.length?xs:['None']).map(x=>chip(x,cl)).join('');
 const tabs=[['overview','Overview'],['operational','Operational Intelligence'],['timeline','Timeline'],['behaviour','Behaviour'],['performance','Performance'],['topology','Topology'],['infrastructure','Infrastructure'],['participants','Clients & Creators'],['launches','Launches'],['evidence','Evidence'],['statistics','Statistics'],['comparison','Compare'],['related','Ecosystem']];
 function stats(f){return '<div class="op-grid">'+[['Launches',f.launches],['Active sessions',f.active_sessions],['Clients',f.client_wallets.length],['Creators',f.unique_creators.length],['Treasuries',f.treasuries.length],['Significance',f.discovery_significance.score],['Evidence',f.evidence_completeness.score+'%'],['Maturity',f.operational_maturity.score]].map(x=>'<div class="op-stat"><strong>'+esc(x[1])+'</strong><span class="op-label">'+esc(x[0])+'</span></div>').join('')+'</div>'}
 function topology(f){let variants=f.intelligence.infrastructure.topology_variants||[f.dominant_topology];return '<h2>Operation topology</h2><p>Every variant is reconstructed from persisted relationships.</p>'+variants.map((variant,v)=>{let nodes=String(variant||'Evidence accumulation incomplete').split(' → ');return '<div class="op-kicker">Variant '+(v+1)+'</div><div class="op-topology">'+nodes.map((n,i)=>'<div class="op-node"><span class="op-kicker">Stage '+(i+1)+'</span><br><b>'+esc(n)+'</b></div>'+(i<nodes.length-1?'<span class="op-arrow">→</span>':'')).join('')+'</div>'}).join('')}
 function rows(xs,fn){return xs&&xs.length?xs.map(fn).join(''):'<tr><td>No persisted records.</td></tr>'}
 function fmt(v,suffix=''){return v==null?'Not available':(typeof v==='number'?Math.round(v*100)/100:v)+suffix}
 function metricSummary(title,m,suffix=''){return '<h3>'+esc(title)+'</h3><div class="op-grid">'+[['Coverage',m.count],['Minimum',fmt(m.minimum,suffix)],['Median',fmt(m.median,suffix)],['Average',fmt(m.average,suffix)],['Maximum',fmt(m.maximum,suffix)]].map(x=>'<div class="op-stat"><strong>'+esc(x[1])+'</strong><span class="op-label">'+esc(x[0])+'</span></div>').join('')+'</div>'}
 function render(f,registry){
  const intel=f.intelligence,p=intel.performance,b=intel.behaviour,infra=intel.infrastructure,audit=intel.evidence_audit,eco=intel.ecosystem_context,overview=intel.overview;
  const launchRows=p.launches||[],evidenceRows=Object.entries(audit.categories||{}).flatMap(([category,items])=>items.map(item=>({category,...item})));
  const panels={
   overview:'<h2>Operation executive summary</h2>'+stats(f)+'<div class="op-two"><div><h3>Identity and lifecycle</h3><p>Lifecycle: '+esc(f.lifecycle_state)+'</p><p>Discovery date: '+esc(when(overview.discovery_date))+'</p><p>Operation age: '+fmt(overview.operation_age_seconds==null?null:overview.operation_age_seconds/86400,' days')+'</p><p>Current activity: '+esc(overview.current_activity)+'</p><p>Promotion status: '+esc(overview.promotion_status)+'</p><h3>Known mechanisms</h3>'+chips(overview.known_mechanisms)+'</div><div>'+topology(f)+'<h3>Related operations</h3>'+chips((eco.related_operations||[]).map(x=>x.family_name))+'</div></div>',
   topology:topology(f),
   infrastructure:'<h2>Operation infrastructure</h2><div class="op-two"><div><h3>Treasuries</h3>'+chips(infra.treasuries)+'<h3>Persistent clients</h3>'+chips(infra.persistent_clients)+'<h3>Known relays</h3>'+chips(infra.known_relays)+'</div><div><h3>Mechanisms</h3>'+chips(infra.mechanisms)+'<h3>RPC-confirmed edges</h3><p>'+infra.rpc_confirmed_edges.length+' signed persisted edges</p><h3>Sessions</h3><p>'+infra.session_count+' persisted sessions</p></div></div><h3>Funding paths</h3><table class="op-table"><thead><tr><th>Observed</th><th>From</th><th>To</th><th>Type</th><th>Mechanism</th><th>Signature</th></tr></thead><tbody>'+rows(infra.funding_paths,x=>'<tr><td>'+esc(when(x.observed_at))+'</td><td class="op-list">'+esc(x.from)+'</td><td class="op-list">'+esc(x.to)+'</td><td>'+esc(x.type)+'</td><td>'+esc(x.mechanism)+'</td><td class="op-list">'+esc(x.signature)+'</td></tr>')+'</tbody></table>',
   participants:'<h2>Clients and creators</h2><div class="op-two"><div><h3>Clients</h3>'+chips(f.client_wallets)+'</div><div><h3>Creators</h3>'+chips(f.unique_creators)+'</div></div>',
   launches:'<h2>Launch registry</h2><table class="op-table"><thead><tr><th>Launch</th><th>Created</th><th>Migrated</th><th>Migration</th><th>Peak market cap</th></tr></thead><tbody>'+rows(launchRows,x=>'<tr><td><a href="'+esc(x.token_href)+'">'+esc(x.mint)+'</a></td><td>'+esc(when(x.created_at))+'</td><td>'+esc(x.migrated?'Yes':'No persisted migration')+'</td><td>'+fmt(x.migration_seconds,' sec')+'</td><td>'+fmt(x.peak_market_cap)+'</td></tr>')+'</tbody></table>',
   timeline:'<h2>Chronological operation timeline</h2><table class="op-table"><thead><tr><th>Time</th><th>Event</th><th>Detail</th><th>Source</th></tr></thead><tbody>'+rows(intel.timeline,e=>'<tr><td>'+esc(when(e.timestamp))+'</td><td>'+esc(e.type)+'</td><td>'+esc(e.label)+'</td><td>'+esc(e.source)+'</td></tr>')+'</tbody></table>',
   behaviour:'<h2>Operation behaviour</h2>'+metricSummary('Launch cadence',b.launch_cadence_hours,' h')+'<div class="op-two"><div><h3>Mechanism distribution</h3>'+chips(Object.entries(b.mechanism_distribution||{}).map(x=>x[0]+': '+x[1]))+'<h3>UTC launch hours</h3>'+chips(Object.entries(b.utc_hour_distribution||{}).map(x=>x[0]+':00 · '+x[1]))+'</div><div><h3>Reuse</h3><p>Treasuries: '+b.treasury_reuse.unique+' unique / '+b.treasury_reuse.relationships+' relationships</p><p>Clients: '+b.client_reuse.unique+' unique / '+b.client_reuse.relationships+' relationships</p><p>Creators: '+b.creator_reuse.unique+' unique / '+b.creator_reuse.relationships+' relationships</p><p>Behaviour drift: '+fmt(b.behaviour_drift)+'</p><h3>Operational changes</h3>'+chips(b.operational_changes)+'</div></div>',
   performance:'<h2>Operation performance</h2><p>Only persisted token metrics are shown. Win rate, failures and success buckets remain unavailable until their definitions are persisted.</p><div class="op-grid">'+[['Launches',p.total_launches],['With metrics',p.tokens_with_metrics],['Migrated',p.migrated],['Failed',fmt(p.failed)],['Win rate',fmt(p.win_rate)],['Success buckets',fmt(p.success_buckets)]].map(x=>'<div class="op-stat"><strong>'+esc(x[1])+'</strong><span class="op-label">'+esc(x[0])+'</span></div>').join('')+'</div>'+metricSummary('Migration speed',p.migration_seconds,' sec')+metricSummary('Peak market cap',p.peak_market_cap)+'<h3>Top launches</h3><table class="op-table"><tbody>'+rows(p.top_launches,x=>'<tr><td><a href="'+esc(x.token_href)+'">'+esc(x.mint)+'</a></td><td>Peak '+fmt(x.peak_market_cap)+'</td><td>'+esc(when(x.created_at))+'</td></tr>')+'</tbody></table>',
   evidence:'<h2>Traceable evidence audit</h2><p>'+esc(audit.confidence_explanation)+'</p><div class="op-two"><div><h3>Outstanding questions</h3>'+chips(audit.outstanding_questions,'warn')+'</div><div><h3>Conflicts and exclusions</h3>'+chips([...(audit.conflicts||[]),...(audit.exclusions||[]).map(x=>x.type+': '+x.detail)],'warn')+'</div></div><table class="op-table"><thead><tr><th>Class</th><th>Source</th><th>Persisted detail</th></tr></thead><tbody>'+rows(evidenceRows,e=>'<tr><td>'+esc(e.category)+'</td><td>'+esc(e.source)+'</td><td class="op-list">'+esc(typeof e.detail==='string'?e.detail:JSON.stringify(e.detail))+'</td></tr>')+'</tbody></table>',
   operational:'<h2>What is this operation doing now?</h2>'+stats(f)+'<div class="op-two"><div><h3>Current activity</h3><p>Last material activity: '+esc(when(f.last_material_activity_at))+'</p><p>Active sessions: '+f.active_sessions+' of '+f.session_count+'</p><p>Launch frequency: '+fmt(b.launch_frequency_per_active_day,' per active day')+'</p><p>Current classification: '+esc(f.current_classification)+'</p></div><div>'+topology(f)+'</div></div>',
   statistics:'<h2>Operation statistics</h2>'+stats(f)+'<div class="op-two"><div><h3>Discovery significance</h3>'+chips((f.discovery_significance.dimensions||[]).map(x=>x.label+': '+x.score+'/'+x.maximum))+'</div><div><h3>Operational maturity</h3>'+chips((f.operational_maturity.dimensions||[]).map(x=>x.label+': '+x.score+'/'+x.maximum))+'</div></div>',
   comparison:'<h2>Cross-operation comparison</h2><p>Compare any discovered operation using the same dimensions.</p><select id="op-compare"><option value="">Select an operation</option>'+intel.comparison_peers.map((x,i)=>'<option value="'+i+'">'+esc(x.family_name)+' · '+esc(x.lifecycle_state)+'</option>').join('')+'</select><div id="op-compare-result"></div>',
   related:'<h2>Ecosystem context</h2><div id="op-ledger"></div><div class="op-grid">'+[['Launch share',fmt(eco.launch_share_percent,'%')],['Discovery rank',eco.discovery_rank],['Launch rank',eco.launch_rank],['Infrastructure rank',eco.infrastructure_rank],['Growth rank',eco.growth_rank],['Unknown population',eco.unknown_population]].map(x=>'<div class="op-stat"><strong>'+esc(x[1])+'</strong><span class="op-label">'+esc(x[0])+'</span></div>').join('')+'</div><h3>Related operations</h3>'+((eco.related_operations||[]).map(x=>'<a class="op-chip" href="'+esc(x.profile_href)+'">'+esc(x.family_name)+' · shared '+x.shared_treasuries.length+' treasuries · '+x.shared_mechanisms.length+' mechanisms</a>').join('')||'<p>No persisted relationship to another operation.</p>')
  };
  Object.entries(panels).forEach(([k,v])=>document.querySelector('[data-panel="'+k+'"]').innerHTML=v);
  let r=registry.reconciliation||{};document.getElementById('op-ledger').innerHTML='<div class="op-grid">'+[['Persisted',r.total_tokens],['Confirmed',r.confirmed_tokens],['Emerging',r.emerging_tokens],['Candidate',r.candidate_tokens],['Unknown',r.unknown_tokens],['Ledger',r.balanced?'Reconciled':'Discrepancy']].map(x=>'<div class="op-stat"><strong>'+esc(x[1])+'</strong><span class="op-label">'+esc(x[0])+'</span></div>').join('')+'</div>';
  document.getElementById('op-compare').onchange=e=>{let peer=intel.comparison_peers[Number(e.target.value)];document.getElementById('op-compare-result').innerHTML=peer?'<div class="op-grid">'+[['Operation',peer.family_name],['State',peer.lifecycle_state],['Launches',peer.launches],['Treasuries',peer.treasuries],['Clients',peer.clients],['Significance',peer.significance],['Evidence',peer.evidence],['Maturity',peer.maturity]].map(x=>'<div class="op-stat"><strong>'+esc(x[1])+'</strong><span class="op-label">'+esc(x[0])+'</span></div>').join('')+'</div><h3>Topology</h3><p>'+esc(peer.topology)+'</p><h3>Mechanisms</h3>'+chips(peer.mechanisms)+'<p><a href="'+esc(peer.profile_href)+'">Open comparison operation →</a></p>':''}
 }
 function activate(name){if(!tabs.some(x=>x[0]===name))name='overview';document.querySelectorAll('[data-panel]').forEach(x=>x.hidden=x.dataset.panel!==name);document.querySelectorAll('.op-tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===name));history.replaceState(null,'','?tab='+encodeURIComponent(name))}
 Promise.all([fetch('/api/ops/emerging-operators/'+encodeURIComponent(entity)).then(r=>r.json()),fetch('/api/ops/emerging-operators').then(r=>r.json())]).then(([detail,registry])=>{if(!detail.ok)throw Error(detail.error||'Operation not found');let f=detail.family;document.getElementById('op-root').className='op-wrap state-'+f.lifecycle_state;document.getElementById('op-name').textContent=f.family_name;document.getElementById('op-state').textContent=f.lifecycle_state;document.getElementById('op-subtitle').textContent='First seen '+when(f.first_seen_at)+' · Last material activity '+when(f.last_material_activity_at);document.getElementById('op-tabs').innerHTML=tabs.map(x=>'<button class="op-tab" data-tab="'+x[0]+'">'+x[1]+'</button>').join('');render(f,registry);document.getElementById('op-loading').hidden=true;document.getElementById('op-content').hidden=false;document.querySelectorAll('.op-tab').forEach(x=>x.onclick=()=>activate(x.dataset.tab));activate(new URLSearchParams(location.search).get('tab')||'overview')}).catch(e=>{document.getElementById('op-loading').innerHTML='<span class="op-alert">'+esc(e.message)+'</span>'});
})();
</script>
{% endblock %}
