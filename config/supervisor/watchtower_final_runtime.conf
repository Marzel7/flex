; Install as a Supervisor include with WATCHTOWER_FINAL_ROOT set to this clean worktree.
[program:watchtower_final_monitor]
command=%(ENV_WATCHTOWER_FINAL_ROOT)s/scripts/launch_watchtower_final.sh worker %(ENV_WATCHTOWER_FINAL_SHA)s %(ENV_WATCHTOWER_FINAL_SELECTION)s
directory=%(ENV_WATCHTOWER_FINAL_ROOT)s
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true

[program:watchtower_final_ui]
command=%(ENV_WATCHTOWER_FINAL_ROOT)s/scripts/launch_watchtower_final.sh ui %(ENV_WATCHTOWER_FINAL_SHA)s
directory=%(ENV_WATCHTOWER_FINAL_ROOT)s
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true
