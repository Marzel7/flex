<script>
(function(){
 const entity={{ entity|tojson }},esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),when=t=>t?new Date(t*1000).toLocaleString():'Unknown';
 const promotionFor=d=>({CONFIRMED_OPERATION:'CONFIRMED OPERATION',OPERATOR_CANDIDATE:'OPERATOR CANDIDATE',REVIEW:'READY FOR REVIEW'}[d]||'NOT ELIGIBLE');
 const empty=label=>'<div class="rp-empty">'+esc(label)+'</div>',chips=xs=>(xs||[]).map(x=>'<span class="rp-chip">'+esc(x)+'</span>').join('');
 const field=(label,value)=>'<div class="rp-field"><strong>'+value+'</strong><span class="rp-label">'+esc(label)+'</span></div>';

 const newest=(xs,keys)=>(xs||[]).slice().sort((a,b)=>{const pick=x=>{for(const k of keys)if(x&&x[k]!=null)return Number(x[k])||0;return 0};return pick(b)-pick(a)});
 const evidenceLabel=x=>{const type=String(x.evidence_type||''),compact={TREASURY_RELATIONSHIPS:'Treasury',PROVISIONING_LINEAGE:'Provisioning',CREATOR_REUSE_CONTROL:'Creator Reuse',RPC_CONFIRMATION_UNAVAILABLE:'RPC Confirmation',RPC_PROVENANCE_UNAVAILABLE:'RPC Provenance',SETTLEMENT_UNAVAILABLE:'Settlement',SESSIONS_UNAVAILABLE:'Sessions'};return compact[type]||String(x.label||type||'Evidence').replace(/\bUnavailable\b/gi,'').replace(/\bRpc\b/g,'RPC').replace(/_/g,' ').trim()};
 const evidenceRows=xs=>xs&&xs.length?newest(xs,['observed_at','timestamp','created_at']).map(x=>'<div class="rp-evidence"><b>'+esc(evidenceLabel(x))+'</b><div>'+esc(x.description||x.applicability_reason||'Persisted evidence observation.')+'</div><small>'+esc([x.truth_status,x.applicability,x.provenance,x.dependency_group,x.observation_count==null?'':x.observation_count+' observations'].filter(Boolean).join(' · '))+'</small></div>').join(''):empty('None.');
 const groupedEvidence=(xs,creators)=>{const groups={};(xs||[]).forEach(x=>(groups[x.evidence_type||x.label||'EVIDENCE']??=[]).push(x));return Object.values(groups).map(items=>{const first=items[0],observations=items.reduce((n,x)=>n+(Number(x.observation_count)||1),0),creatorMeta=String(first.evidence_type||'').includes('CREATOR')&&creators.length?' · '+creators.length+' creators':'';return '<div class="rp-evidence-group"><strong>'+esc(evidenceLabel(first))+'</strong><small>'+observations+' observations'+creatorMeta+'</small></div>'}).join('')};
 const compactRows=(xs,fn,label)=>xs&&xs.length?'<div class="rp-list">'+xs.map(fn).join('')+'</div>':empty(label);
 const abbrev=value=>{value=String(value||'');return value.length>11?value.slice(0,5)+'…':value||'—'};
 const roleView=role=>{role=role||{};const edges=role.edges||[],observations=role.observed_relationships||[],typical=observations.slice(0,3).map(o=>{const hops=(o.funding_hops||[{mechanism:o.mechanism,transaction:o.transaction,transaction_at:o.transaction_at}]).slice().sort((a,b)=>(b.transaction_at||0)-(a.transaction_at||0)),txs=hops.map(h=>'<div><strong>'+esc(h.mechanism||'Observed funding')+'</strong>'+esc(h.transaction_at?new Date(h.transaction_at*1000).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'Transaction date unavailable')+(h.transaction?'<a class="rp-role-tx" href="https://solscan.io/tx/'+encodeURIComponent(h.transaction)+'" target="_blank" rel="noopener noreferrer" title="'+esc(h.transaction)+'">Funding Tx '+esc(abbrev(h.transaction))+' ↗</a>':'')+'</div>').join(''),launchText=(o.launch_label&&o.launch_label!=='Launch'?o.launch_label+' · ':'Launch ') + abbrev(o.launch),launch='<div class="rp-role-context">Observed while tracing <a href="/token-intelligence?mint='+encodeURIComponent(o.launch||'')+'" title="Launch mint '+esc(o.launch)+'">'+esc(launchText)+'</a></div>',wallets=[o.controller,o.intermediary,o.creator].filter(Boolean),path=wallets.map(w=>'<span title="'+esc(w)+'">'+esc(abbrev(w))+'</span>').join('<span class="arrow">→</span>');return '<div class="rp-role-observation"><div><div class="rp-role-path">'+path+'</div>'+launch+'</div><div class="rp-role-meta">'+txs+'</div></div>'}).join('');const detail=edges.map(e=>'<div class="rp-role-edge"><span>'+esc(e.from)+' → '+esc(e.to)+'<br><small>'+esc(String(e.relationship_type||'').replace(/_/g,' '))+'</small></span><span>'+esc(e.observation_count||0)+' observations</span></div>').join('');return '<section class="rp-role"><div class="rp-role-head"><div><div class="rp-label">Operational Role</div><div class="rp-role-title">'+esc(role.current_role||'Unknown')+'</div></div><span class="rp-role-badge">'+(role.evidence_backed?'Recorded evidence':'No recorded edges')+'</span></div>'
