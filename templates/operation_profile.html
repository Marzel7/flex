{% extends "base_shell.html" %}
{% block title %}Operation Profile — Intelligence{% endblock %}
{% block content %}
<style>
.op-wrap{max-width:1500px;margin:auto;padding:24px}.op-hero,.op-panel,.op-node,.op-stat{border:1px solid var(--ip-border);background:var(--ip-card);border-radius:10px}.op-hero{padding:22px;border-left:5px solid var(--state-color,#64748b)}.op-title-row{display:flex;justify-content:space-between;gap:15px;align-items:start}.op-name{font-size:30px;font-weight:800}.op-badge{color:var(--state-color);border:1px solid var(--state-color);border-radius:14px;padding:5px 9px;font-size:10px}.op-tabs{display:flex;gap:6px;overflow:auto;margin:18px 0}.op-tab{border:1px solid var(--ip-border);background:transparent;color:var(--ip-sec);padding:8px 11px;border-radius:8px;cursor:pointer;white-space:nowrap}.op-tab.active{color:#fff;border-color:var(--state-color);background:color-mix(in srgb,var(--state-color) 12%,transparent)}.op-panel{padding:18px;margin:12px 0}.op-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.op-stat{padding:14px}.op-stat strong{display:block;font-size:23px}.op-label,.op-kicker{font-size:9px;color:var(--ip-dim);text-transform:uppercase;letter-spacing:.09em}.op-two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.op-topology{display:flex;align-items:center;gap:10px;margin:17px 0}.op-node{flex:1;padding:22px 10px;text-align:center;border-top:3px solid var(--state-color)}.op-arrow{font-size:20px;color:var(--state-color)}.op-chip{display:inline-block;font-size:9px;padding:4px 7px;border:1px solid var(--ip-border);border-radius:12px;margin:3px}.op-chip.warn{color:#fbbf24}.op-table{width:100%;border-collapse:collapse;font-size:11px}.op-table td,.op-table th{padding:9px;border-bottom:1px solid var(--ip-border);text-align:left;vertical-align:top}.op-list{font:11px monospace;overflow-wrap:anywhere}.op-panel[hidden]{display:none}.state-CONFIRMED{--state-color:#22c55e}.state-EMERGING,.state-ESTABLISHED{--state-color:#f59e0b}.state-CANDIDATE,.state-SIGNIFICANT_ACTIVE{--state-color:#60a5fa}.state-DORMANT{--state-color:#9ca3af}.state-RETIRED{--state-color:#4b5563}.state-BACKGROUND{--state-color:#64748b}.op-alert{color:#f87171}.op-ok{color:#4ade80}@media(max-width:800px){.op-grid{grid-template-columns:repeat(2,1fr)}.op-two{grid-template-columns:1fr}.op-topology{flex-direction:column}.op-arrow{transform:rotate(90deg)}}
</style>
<main class="op-wrap state-BACKGROUND" id="op-root">
 <div class="ip-breadcrumb"><a href="/ops-os">Mission Control</a><span class="sep">›</span><a href="/intelligence/operations">Operation Discovery</a><span class="sep">›</span><span>Operation Profile</span></div>
 <div id="op-loading" class="op-panel">Loading operation profile…</div>
 <div id="op-content" hidden>
  <header class="op-hero"><div class="op-title-row"><div><div class="op-kicker">Operation profile</div><h1 class="op-name" id="op-name"></h1><p id="op-subtitle"></p></div><span class="op-badge" id="op-state"></span></div></header>
  <nav class="op-tabs" aria-label="Operation profile sections" id="op-tabs"></nav>
  <section class="op-panel" data-panel="overview"></section>
  <section class="op-panel" data-panel="topology" hidden></section>
  <section class="op-panel" data-panel="infrastructure" hidden></section>
  <section class="op-panel" data-panel="participants" hidden></section>
  <section class="op-panel" data-panel="launches" hidden></section>
  <section class="op-panel" data-panel="timeline" hidden></section>
  <section class="op-panel" data-panel="evidence" hidden></section>
  <section class="op-panel" data-panel="operational" hidden></section>
  <section class="op-panel" data-panel="statistics" hidden></section>
  <section class="op-panel" data-panel="related" hidden></section>
 </div>
</main>
<script>
(function(){
 const entity={{ entity|tojson }},esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),when=t=>t?new Date(t*1000).toLocaleString():'Not established';
 const chip=(x,cl='')=>'<span class="op-chip '+cl+'">'+esc(x)+'</span>',chips=(xs,cl='')=>(xs&&xs.length?xs:['None']).map(x=>chip(x,cl)).join('');
 const tabs=[['overview','Overview'],['topology','Topology'],['infrastructure','Infrastructure & Treasuries'],['participants','Clients & Creators'],['launches','Launches'],['timeline','Timeline'],['evidence','Evidence'],['operational','Operational Intelligence'],['statistics','Statistics'],['related','Related & Ecosystem']];
 function stats(f){return '<div class="op-grid">'+[['Launches',f.launches],['Active sessions',f.active_sessions],['Clients',f.client_wallets.length],['Creators',f.unique_creators.length],['Treasuries',f.treasuries.length],['Significance',f.discovery_significance.score],['Evidence',f.evidence_completeness.score+'%'],['Maturity',f.operational_maturity.score]].map(x=>'<div class="op-stat"><strong>'+esc(x[1])+'</strong><span class="op-label">'+esc(x[0])+'</span></div>').join('')+'</div>'}
 function topology(f){let nodes=String(f.dominant_topology||'Evidence accumulation incomplete').split(' → ');return '<h2>Operation topology</h2><p>This visual identity is reconstructed from persisted relationships.</p><div class="op-topology">'+nodes.map((n,i)=>'<div class="op-node"><span class="op-kicker">Stage '+(i+1)+'</span><br><b>'+esc(n)+'</b></div>'+(i<nodes.length-1?'<span class="op-arrow">→</span>':'')).join('')+'</div><div class="op-kicker">Observed variants</div>'+chips(f.observed_topology_variants)}
 function rows(xs,fn){return xs&&xs.length?xs.map(fn).join(''):'<tr><td>No persisted records.</td></tr>'}
 function render(f,registry){let panels={overview:'<h2>What is this operation?</h2>'+stats(f)+'<div class="op-two"><div><h3>Why it is visible</h3>'+chips(f.why_surfaced)+'</div><div><h3>Outstanding evidence</h3>'+chips(f.blocking_reasons,'warn')+'</div></div>',topology:topology(f),infrastructure:'<h2>Infrastructure and treasuries</h2><div class="op-two"><div><h3>Member infrastructure</h3><div class="op-list">'+chips(f.member_wallets)+'</div></div><div><h3>Treasuries</h3><div class="op-list">'+chips(f.treasuries)+'</div></div></div><h3>Funding mechanisms</h3>'+chips(f.funding_mechanisms),participants:'<h2>Clients and creators</h2><div class="op-two"><div><h3>Clients</h3>'+chips(f.client_wallets)+'</div><div><h3>Creators</h3><div class="op-list">'+chips(f.unique_creators)+'</div></div></div>',launches:'<h2>Launch registry</h2><table class="op-table"><thead><tr><th>Mint</th><th>Operation state</th></tr></thead><tbody>'+rows(f.launch_list,m=>'<tr><td class="op-list">'+esc(m)+'</td><td>'+esc(f.lifecycle_state)+'</td></tr>')+'</tbody></table>',timeline:'<h2>Operation timeline</h2><table class="op-table"><thead><tr><th>Time</th><th>Event</th><th>Evidence</th></tr></thead><tbody>'+rows(f.growth_timeline,e=>'<tr><td>'+esc(when(e.timestamp))+'</td><td>'+esc(e.event_type)+'</td><td>'+esc(e.label)+'</td></tr>')+'</tbody></table>',evidence:'<h2>Evidence package</h2><p>Emerging status means current analyst attention. Only confirmation is a manual governance action.</p><div class="op-two"><div><h3>Evidence sources</h3>'+chips(f.evidence_sources)+'</div><div><h3>Missing evidence</h3>'+chips(f.missing_evidence,'warn')+'</div></div><h3>Supporting records</h3><table class="op-table"><tbody>'+rows(f.supporting_evidence,e=>'<tr><td>'+esc(e.type)+'</td><td>'+esc(e.source)+'</td><td>'+esc(typeof e.detail==='string'?e.detail:JSON.stringify(e.detail))+'</td></tr>')+'</tbody></table>',operational:'<h2>What is this operation doing now?</h2>'+stats(f)+'<div class="op-two"><div><h3>Current activity</h3><p>Last material activity: '+esc(when(f.last_material_activity_at))+'</p><p>Active sessions: '+f.active_sessions+' of '+f.session_count+'</p><p>Current classification: '+esc(f.current_classification)+'</p></div><div>'+topology(f)+'</div></div>',statistics:'<h2>Operation statistics</h2>'+stats(f)+'<div class="op-two"><div><h3>Discovery significance</h3>'+chips((f.discovery_significance.dimensions||[]).map(x=>x.label+': '+x.score+'/'+x.maximum))+'</div><div><h3>Operational maturity</h3>'+chips((f.operational_maturity.dimensions||[]).map(x=>x.label+': '+x.score+'/'+x.maximum))+'</div></div>',related:'<h2>Ecosystem intelligence</h2><div id="op-ledger"></div><h3>Other surfaced operations</h3>'+((registry.families||[]).filter(x=>x.family_id!==f.family_id).map(x=>'<a class="op-chip" href="'+esc(x.profile_href)+'">'+esc(x.family_name)+' · '+esc(x.lifecycle_state)+'</a>').join('')||'<p>No other surfaced operations.</p>')};Object.entries(panels).forEach(([k,v])=>document.querySelector('[data-panel="'+k+'"]').innerHTML=v);let r=registry.reconciliation||{};document.getElementById('op-ledger').innerHTML='<div class="op-grid">'+[['Persisted',r.total_tokens],['Confirmed',r.confirmed_tokens],['Emerging',r.emerging_tokens],['Candidate',r.candidate_tokens],['Unknown',r.unknown_tokens],['Ledger',r.balanced?'Reconciled':'Discrepancy']].map(x=>'<div class="op-stat"><strong>'+esc(x[1])+'</strong><span class="op-label">'+esc(x[0])+'</span></div>').join('')+'</div>'+(r.source_overlap_count?'<p class="op-alert">'+r.source_overlap_count+' source overlaps were resolved by lifecycle precedence and exposed for audit.</p>':'<p class="op-ok">Exclusive token ledger reconciles.</p>')}
 function activate(name){if(!tabs.some(x=>x[0]===name))name='overview';document.querySelectorAll('[data-panel]').forEach(x=>x.hidden=x.dataset.panel!==name);document.querySelectorAll('.op-tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===name));history.replaceState(null,'','?tab='+encodeURIComponent(name))}
 Promise.all([fetch('/api/ops/emerging-operators/'+encodeURIComponent(entity)).then(r=>r.json()),fetch('/api/ops/emerging-operators').then(r=>r.json())]).then(([detail,registry])=>{if(!detail.ok)throw Error(detail.error||'Operation not found');let f=detail.family;document.getElementById('op-root').className='op-wrap state-'+f.lifecycle_state;document.getElementById('op-name').textContent=f.family_name;document.getElementById('op-state').textContent=f.lifecycle_state;document.getElementById('op-subtitle').textContent='First seen '+when(f.first_seen_at)+' · Last material activity '+when(f.last_material_activity_at);document.getElementById('op-tabs').innerHTML=tabs.map(x=>'<button class="op-tab" data-tab="'+x[0]+'">'+x[1]+'</button>').join('');render(f,registry);document.getElementById('op-loading').hidden=true;document.getElementById('op-content').hidden=false;document.querySelectorAll('.op-tab').forEach(x=>x.onclick=()=>activate(x.dataset.tab));activate(new URLSearchParams(location.search).get('tab')||'overview')}).catch(e=>{document.getElementById('op-loading').innerHTML='<span class="op-alert">'+esc(e.message)+'</span>'});
})();
</script>
{% endblock %}
