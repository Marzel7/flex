{% extends "base_shell.html" %}
{% block title %}Investigation Profile{% endblock %}
{% block content %}
<style>
.rp-wrap{max-width:1180px;margin:auto;padding:24px;--rp-color:#64748b}.rp-hero,.rp-panel,.rp-disclosure{border:1px solid var(--ip-border);background:var(--ip-card);border-radius:8px}.rp-hero{padding:14px 18px;border-left:4px solid var(--rp-color)}.rp-kicker,.rp-label{font-size:9px;color:var(--ip-dim);text-transform:uppercase;letter-spacing:.05em}.rp-name{font-size:26px;line-height:1.1;margin:4px 0}.rp-badge,.rp-chip,.rp-state{display:inline-block;border:1px solid var(--ip-border);border-radius:14px;padding:4px 8px;font-size:9px}.rp-badge{border-color:var(--rp-color);color:var(--rp-color);font-weight:750}.rp-state{color:var(--ip-sec)}.rp-tabs{display:flex;gap:20px;margin:18px 0 0;border-bottom:1px solid var(--ip-border)}.rp-tab{border:0;border-bottom:2px solid transparent;background:none;color:var(--ip-dim);padding:8px 1px;font-size:11px;cursor:pointer}.rp-tab.active{color:var(--rp-color);border-bottom-color:var(--rp-color)}.rp-panel{padding:16px;margin:12px 0;border-top:2px solid color-mix(in srgb,var(--rp-color) 45%,var(--ip-border))}.rp-panel[hidden]{display:none}.rp-section{margin:0 0 18px}.rp-section:last-child{margin-bottom:0}.rp-section h2{font-size:14px;margin:0 0 9px;padding-left:8px;border-left:2px solid var(--rp-color);color:var(--rp-color)}.rp-section h3{font-size:11px;margin:12px 0 7px}.rp-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.rp-field{padding:9px 10px;border:1px solid var(--ip-border);border-left:2px solid var(--rp-color);border-radius:6px}.rp-field strong{display:block;font-size:12px;margin-bottom:3px}.rp-field a,.rp-action-link{color:var(--rp-color)}.rp-identity{--identity-color:#94a3b8;border:1px solid var(--ip-border);border-left:4px solid var(--identity-color);border-radius:8px;padding:13px 14px;background:var(--ip-card)}.rp-identity-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}.rp-identity-icon{color:var(--identity-color);font-size:16px}.rp-identity-badge{color:var(--identity-color);border:1px solid var(--identity-color);border-radius:13px;padding:4px 8px;font-size:9px;font-weight:750}.rp-identity-key{font:12px ui-monospace,monospace;color:var(--ip-sec);margin-left:auto;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rp-identity-metrics{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ip-border)}.rp-identity-metric{padding:9px 10px 0}.rp-identity-metric:first-child{padding-left:0}.rp-identity-metric strong{display:block;font-size:15px}.identity-confirmed{--identity-color:#22c55e}.identity-treasury{--identity-color:#60a5fa}.identity-controller{--identity-color:#a78bfa}.identity-shared{--identity-color:#f97316}.identity-session{--identity-color:#eab308}.identity-unknown{--identity-color:#94a3b8}.rp-status-strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:10px}.rp-metadata{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--ip-border);border-left:3px solid var(--rp-color);border-radius:7px;overflow:hidden;margin-bottom:10px}.rp-meta{padding:10px 12px;border-right:1px solid var(--ip-border)}.rp-meta:last-child{border-right:0}.rp-meta strong{display:block;font-size:15px}.rp-record-note{font-size:10px;color:var(--ip-dim);margin:7px 0 10px}.rp-next{display:flex;gap:6px;flex-wrap:wrap}.rp-next .rp-chip{color:#fbbf24;border-color:rgba(245,158,11,.35)}.rp-groups{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.rp-disclosure{padding:0 12px}.rp-disclosure>summary{display:flex;gap:8px;align-items:center;cursor:pointer;padding:11px 0;font-size:11px;font-weight:700;color:var(--rp-color)}.rp-disclosure>summary span{margin-left:auto;color:var(--ip-dim)}.rp-disclosure-body{border-top:1px solid var(--ip-border);padding:9px 0 11px}.rp-evidence{padding:7px 0;border-bottom:1px solid var(--ip-border);font-size:10px}.rp-evidence:last-child{border:0}.rp-evidence b{display:block;color:var(--ip-text)}.rp-evidence small{color:var(--ip-dim)}.rp-list{display:flex;flex-direction:column;gap:5px}.rp-row{display:grid;grid-template-columns:1fr 140px 130px;gap:8px;padding:8px 9px;border:1px solid var(--ip-border);border-radius:6px;font-size:10px}.rp-empty{padding:9px 10px;border:1px dashed var(--ip-border);border-left:2px solid var(--rp-color);border-radius:6px;color:var(--ip-dim);font-size:10px}.rp-action{color:#fff;background:#166534;border:1px solid #22c55e;border-radius:6px;padding:7px 10px;cursor:pointer;font-size:10px;font-weight:700}.rp-form{display:grid;gap:7px;max-width:620px;margin-top:10px}.rp-form input,.rp-form textarea{background:var(--ip-bg);color:var(--ip-text);border:1px solid var(--ip-border);padding:8px;border-radius:6px}.disp-CONFIRMED_OPERATION{--rp-color:#22c55e}.disp-REVIEW{--rp-color:#f97316}.disp-INFRASTRUCTURE{--rp-color:#60a5fa}.disp-OPERATOR_CANDIDATE{--rp-color:#f59e0b}.disp-UNRESOLVED{--rp-color:#64748b}.disp-REJECTED,.disp-RETIRED{--rp-color:#64748b}@media(max-width:760px){.rp-tabs{overflow:auto}.rp-grid,.rp-groups{grid-template-columns:1fr}.rp-metadata,.rp-identity-metrics{grid-template-columns:repeat(2,1fr)}.rp-row{grid-template-columns:1fr}.rp-name{font-size:22px}.rp-identity-key{max-width:35%}}
</style>
<main class="rp-wrap" id="rp-root">
 <div class="ip-breadcrumb"><a href="/ops-os">Mission Control</a><span class="sep">›</span><a href="/intelligence/operators">Operations Registry</a><span class="sep">›</span><span id="rp-crumb">Investigation</span></div>
 <div id="rp-loading" class="rp-panel">Loading intelligence record…</div>
 <div id="rp-content" hidden>
  <header class="rp-hero"><div class="rp-kicker" id="rp-kind"></div><h1 class="rp-name" id="rp-name"></h1></header>
  <nav class="rp-tabs" id="rp-tabs" aria-label="Profile sections"></nav>
  <section class="rp-panel" data-panel="summary"></section><section class="rp-panel" data-panel="evidence" hidden></section><section class="rp-panel" data-panel="members" hidden></section><section class="rp-panel" data-panel="analysis" hidden></section><section class="rp-panel" data-panel="history" hidden></section>
 </div>
</main>
<script>
(function(){
 const entity={{ entity|tojson }},esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),when=t=>t?new Date(t*1000).toLocaleString():'Unknown';
 const promotionFor=d=>({CONFIRMED_OPERATION:'CONFIRMED OPERATION',OPERATOR_CANDIDATE:'OPERATOR CANDIDATE',REVIEW:'READY FOR REVIEW'}[d]||'NOT ELIGIBLE');
 const empty=label=>'<div class="rp-empty">'+esc(label)+'</div>',chips=xs=>(xs||[]).map(x=>'<span class="rp-chip">'+esc(x)+'</span>').join('');
 const field=(label,value)=>'<div class="rp-field"><strong>'+value+'</strong><span class="rp-label">'+esc(label)+'</span></div>';
 const disclosure=(title,count,body,open)=>'<details class="rp-disclosure" '+(open?'open':'')+'><summary>'+esc(title)+'<span>'+esc(count)+'</span></summary><div class="rp-disclosure-body">'+body+'</div></details>';
 const evidenceRows=xs=>xs&&xs.length?xs.map(x=>'<div class="rp-evidence"><b>'+esc(x.label||x.evidence_type)+'</b><div>'+esc(x.description||x.applicability_reason||'Persisted evidence observation.')+'</div><small>'+esc([x.truth_status,x.applicability,x.observation_count==null?'':x.observation_count+' observations'].filter(Boolean).join(' · '))+'</small></div>').join(''):empty('None recorded.');
 const compactRows=(xs,fn,label)=>xs&&xs.length?'<div class="rp-list">'+xs.map(fn).join('')+'</div>':empty(label);
 function render(f){
  const rec=f.reconciliation||{},pres=f.presentation||{},disp=rec.disposition||pres.disposition||'UNRESOLVED',intel=f.intelligence||{},infra=intel.infrastructure||{},perf=intel.performance||{},behaviour=intel.behaviour||{},investigation=pres.kind==='investigation_population',handoff=f.promotion_handoff||{},confirmation=f.confirmation||{},readiness=rec.promotion_readiness||{};
  const support=rec.supporting_evidence||[],contradictions=rec.contradictory_evidence||[],missing=rec.missing_evidence||[];
  let next=[];if(disp==='UNRESOLVED')next.push('Independent controller evidence');if(disp==='REVIEW')next.push('Resolve contradictory evidence');next.push(...missing.map(x=>x.label||x.evidence_type));next=[...new Set(next)].slice(0,5);
  const canonicalId=f.canonical_operator_id||(String(f.family_id||'').startsWith('canonical:')?String(f.family_id).slice(10):null),sourcePopulation=f.source_population_id||(!investigation?pres.parent_population_id:null),children=pres.child_operations||f.child_operations||[];
  const identityHref=id=>'/intelligence/operator/'+encodeURIComponent(String(id||'').replace(/^canonical:/,'')),populationHref=id=>'/intelligence/operations/'+encodeURIComponent(id);
  const clients=f.client_wallets||[],creators=f.unique_creators||[],treasuries=(f.treasuries||[]).length?f.treasuries:(infra.treasuries||[]),membersList=f.member_wallets||[];
  const identityFor=()=>{if(disp==='CONFIRMED_OPERATION')return ['confirmed','Confirmed Operator','●'];if(disp==='INFRASTRUCTURE')return ['shared','Infrastructure','◆'];if((f.walkback_descendant_count||0)>0&&treasuries.includes(f.family_anchor))return ['treasury','Operational Treasury','◆'];if(membersList.length>1&&treasuries.length>1)return ['shared','Shared Infrastructure','◆'];if(clients.length&&creators.length)return ['controller','Provisioning Controller','◆'];if((f.session_count||0)>0)return ['session','Session Cluster','●'];return ['unknown','Unknown','○']};
  const identity=identityFor(),identityKey=f.family_anchor||f.terminal_entity||membersList[0]||f.family_name,identityCard='<div class="rp-section"><h2>Population Identity</h2><div class="rp-identity identity-'+identity[0]+'"><div class="rp-identity-head"><span class="rp-identity-icon">'+identity[2]+'</span><span class="rp-identity-badge">'+identity[1]+'</span><span class="rp-identity-key">'+esc(identityKey)+'</span></div><div class="rp-identity-metrics">'+[['Launches',f.launches],['Creators',creators.length],['Provisioning Clients',clients.length],['Treasuries',treasuries.length]].map(x=>'<div class="rp-identity-metric"><strong>'+esc(x[1]||'—')+'</strong><span class="rp-label">'+x[0]+'</span></div>').join('')+'</div></div></div>';
  const relationshipFields=[];if(canonicalId)relationshipFields.push(field('Current operator','<a href="'+identityHref(canonicalId)+'">Govern identity</a>'));if(sourcePopulation)relationshipFields.push(field('Parent investigation','<a href="'+populationHref(sourcePopulation)+'">Open source population</a>'));if(children.length)relationshipFields.push(field('Child identities',children.map(x=>'<a href="'+identityHref(x)+'">'+esc(x)+'</a>').join('<br>')));
  const relationships=relationshipFields.length?'<div class="rp-section"><h2>Identity Relationships</h2><div class="rp-grid">'+relationshipFields.join('')+'</div></div>':'';
  let confirmForm='';if(pres.confirmation_permitted&&disp==='OPERATOR_CANDIDATE'&&handoff.proposal_id)confirmForm='<div class="rp-form"><input id="rp-by" placeholder="Analyst"><input id="rp-reason-input" placeholder="Confirmation reason"><textarea id="rp-notes" placeholder="Supporting notes (optional)"></textarea><button class="rp-action" id="rp-confirm">Confirm Operation</button><div id="rp-result"></div></div>';
  const summary=identityCard+'<div class="rp-status-strip">'+field('Disposition',esc(disp))+field('Promotion',esc(promotionFor(disp)))+'</div>'+(next.length?'<div class="rp-section" style="margin-top:12px"><h2>Next Evidence</h2><div class="rp-next">'+chips(next)+'</div></div>':'');
  const blockers=(readiness.blockers||[]).length?'<div class="rp-section"><h2>Promotion Blockers</h2>'+compactRows(readiness.blockers,x=>'<div class="rp-row"><span>'+esc(x)+'</span></div>','No blockers recorded.')+'</div>':'';
  const evidence='<div class="rp-groups">'+disclosure('Supporting',rec.supporting_evidence_count||support.length,evidenceRows(support))+disclosure('Contradictory',rec.contradictory_evidence_count||contradictions.length,evidenceRows(contradictions),contradictions.length>0)+disclosure('Missing',rec.missing_evidence_count||missing.length,evidenceRows(missing))+'</div>'+blockers+confirmForm;
  const launchRows=perf.launches||[];
  const attributedLaunches=Number(f.launches||0),displayValue=n=>n>0?esc(n):'—',metadata='<div class="rp-metadata"><div class="rp-meta"><strong>'+displayValue(attributedLaunches)+'</strong><span class="rp-label">Attributed launches</span></div><div class="rp-meta"><strong>'+displayValue(creators.length)+'</strong><span class="rp-label">Creators</span></div><div class="rp-meta"><strong>'+displayValue(clients.length)+'</strong><span class="rp-label">Provisioning clients</span></div><div class="rp-meta"><strong>'+displayValue(treasuries.length)+'</strong><span class="rp-label">Treasuries</span></div></div>';
  const recordCoverage=launchRows.length===attributedLaunches?launchRows.length+' attributed launches with detailed records available.':attributedLaunches+' attributed launches · '+launchRows.length+' detailed launch records available.';
  const launchDetail=launchRows.length?compactRows(launchRows,x=>'<div class="rp-row"><a href="'+esc(x.token_href||'#')+'">'+esc(x.mint)+'</a><span>'+esc(when(x.created_at))+'</span><span>'+esc(x.migrated?'Migrated':'Not migrated')+'</span></div>',''):empty('No launch records are currently available for this Investigation Population.');
  const membership=[...clients,...creators,...treasuries],members=relationships+'<div class="rp-section"><h2>Population Metadata</h2>'+metadata+'<div class="rp-record-note">'+esc(recordCoverage)+'</div></div><div class="rp-section"><h2>Launch Records</h2>'+launchDetail+'</div>'+disclosure('Current Membership',membership.length,membership.length?chips(membership):empty('No member identities have been identified yet.'));
  const walkbacks=(intel.timeline||[]).filter(x=>String(x.type||'').toUpperCase().includes('WALKBACK')||String(x.source||'').toLowerCase().includes('walkback')),metrics=[['Evidence completeness',f.evidence_completeness&&f.evidence_completeness.score,'%'],['Significance',f.discovery_significance&&f.discovery_significance.score,''],['Maturity',f.operational_maturity&&f.operational_maturity.score,''],['Active sessions',f.active_sessions,''],['First observed',f.first_observed_at?when(f.first_observed_at):null,''],['Last observed',f.last_observed_at?when(f.last_observed_at):null,'']].filter(x=>x[1]!==null&&x[1]!==undefined&&x[1]!==0);
  const clusters=pres.potential_operator_clusters||[];
  const analysis='<div class="rp-section"><h2>Topology</h2>'+(f.dominant_topology?'<p>'+esc(f.dominant_topology)+'</p>':empty('No topology reconstructed.'))+'</div><div class="rp-section"><h2>Walkback</h2>'+compactRows(walkbacks,x=>'<div class="rp-row"><span>'+esc(x.type)+'</span><span>'+esc(x.label)+'</span><span>'+esc(x.source)+'</span></div>','No walkback evidence.')+'</div>'+disclosure('Infrastructure',((infra.treasuries||[]).length+(infra.persistent_clients||[]).length),chips([...(infra.treasuries||[]),...(infra.persistent_clients||[]),...(infra.known_relays||[]),...(infra.mechanisms||[])])||empty('No infrastructure observations.'))+disclosure('Behaviour',((behaviour.operational_changes||[]).length),chips(behaviour.operational_changes)||empty('No material behaviour changes.'))+disclosure('Potential Clusters',clusters.length,compactRows(clusters,x=>'<div class="rp-row"><span>'+esc(x.cluster_id)+'</span><span>'+esc(x.launch_count)+' launches</span><span>'+esc(x.current_disposition)+'</span></div>','No potential clusters identified.'))+disclosure('Advanced Metrics',metrics.length,'<div class="rp-grid">'+metrics.map(x=>field(x[0],esc(x[1])+x[2])).join('')+'</div>');
  const historyRows=confirmation.history||[],timeline=intel.timeline||[],audit=intel.evidence_audit||{},history='<div class="rp-section"><h2>Identity and Confirmation History</h2>'+compactRows(historyRows,x=>'<div class="rp-row"><span>'+esc(x.action)+'</span><span>'+esc(when(x.action_at))+'</span><span>'+esc(x.action_by)+'</span></div>','No identity events recorded.')+'</div>'+disclosure('Timeline',timeline.length,compactRows(timeline,x=>'<div class="rp-row"><span>'+esc(x.type)+'</span><span>'+esc(when(x.timestamp))+'</span><span>'+esc(x.source)+'</span></div>','No timeline events recorded.'))+disclosure('Audit Trail','',audit.confidence_explanation?'<p>'+esc(audit.confidence_explanation)+'</p>':empty('No audit narrative recorded.'))+disclosure('Legacy Context','', '<p>'+esc(pres.historical_context||'No legacy classification context recorded.')+'</p>');
  const panels={summary:summary,evidence:evidence,members:members,analysis:analysis,history:history};Object.entries(panels).forEach(([k,v])=>document.querySelector('[data-panel="'+k+'"]').innerHTML=v);
  const tabs=[['summary','Summary'],['evidence','Evidence'],['members','Members'],['analysis','Analysis'],['history','History']],aliases={overview:'summary',readiness:'summary',confirmation:'summary',participants:'members',launches:'members',structure:'analysis',walkback:'analysis',topology:'analysis',infrastructure:'analysis',intelligence:'analysis',operational:'analysis',performance:'analysis',statistics:'analysis',comparison:'analysis',clusters:'analysis',related:'analysis',timeline:'history',legacy:'history',reconciliation:'evidence'};
  const requested=new URLSearchParams(location.search).get('tab')||location.hash.slice(1),initial=tabs.some(x=>x[0]===requested)?requested:(aliases[requested]||'summary');document.getElementById('rp-tabs').innerHTML=tabs.map(x=>'<button class="rp-tab '+(x[0]===initial?'active':'')+'" data-tab="'+x[0]+'">'+x[1]+'</button>').join('');const activate=n=>{document.querySelectorAll('.rp-tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===n));document.querySelectorAll('[data-panel]').forEach(x=>x.hidden=x.dataset.panel!==n)};activate(initial);document.querySelectorAll('.rp-tab').forEach(b=>b.onclick=()=>activate(b.dataset.tab));
  const btn=document.getElementById('rp-confirm');if(btn)btn.onclick=()=>{btn.disabled=true;fetch('/api/operators/promotions/'+encodeURIComponent(handoff.proposal_id)+'/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reviewer:document.getElementById('rp-by').value,reason:document.getElementById('rp-reason-input').value,supporting_notes:document.getElementById('rp-notes').value,proposal_fingerprint:handoff.proposal_fingerprint,identity_fingerprint:handoff.identity_fingerprint})}).then(async r=>{let d=await r.json();if(!r.ok)throw Error(d.error||'Confirmation failed');location.href=identityHref(d.canonical_operator_id)}).catch(e=>{btn.disabled=false;document.getElementById('rp-result').textContent=e.message})};
  document.title=(investigation?'Investigation Population':'Operation Profile')+' — '+(f.family_name||'Intelligence Record');document.getElementById('rp-root').className='rp-wrap disp-'+disp;document.getElementById('rp-name').textContent=pres.title||f.family_name;document.getElementById('rp-kind').textContent=investigation?'Investigation Population':pres.label||'Operation';document.getElementById('rp-crumb').textContent=pres.title||f.family_name;document.getElementById('rp-loading').hidden=true;document.getElementById('rp-content').hidden=false;
 }
 fetch('/api/ops/emerging-operators/'+encodeURIComponent(entity)).then(r=>{if(!r.ok)throw Error('Record unavailable');return r.json()}).then(x=>render(x.family)).catch(e=>{document.getElementById('rp-loading').textContent='Unable to load record: '+e.message});
})();
</script>
{% endblock %}
