; DEV-only, uninstalled template for the frozen Watchtower runtime baseline.
; Substitute only the named placeholders in an isolated deployment copy.
; Provider credentials are inherited from the existing approved secret mechanism;
; no credential value belongs in this template.

[program:watchtower_api]
command=__PYTHON_BIN__ -m gunicorn --config __WATCHTOWER_ROOT__/config/gunicorn.conf.py src.core.main:app
directory=__WATCHTOWER_ROOT__
environment=PYTHONPATH="__WATCHTOWER_ROOT__",WATCHTOWER_FINAL_SHA="__WATCHTOWER_FINAL_SHA__",WATCHTOWER_OFFSET_AUDIT_LEDGER_PATH="__WATCHTOWER_OFFSET_AUDIT_LEDGER_PATH__",DB_PATH="__CANONICAL_DB_PATH__",RPC_METRICS_DB="__CANONICAL_DB_PATH__",WT_OPS_DB_PATH="__OPERATIONS_DB_PATH__",OPERATION_MONITOR_QUEUE_PATH="__MONITOR_QUEUE_PATH__",FLEX_WS_DISABLED="1",FLEX_UI_RECOVERY_MODE="0",FLEX_ENABLE_FLASK_BACKGROUND_WORKERS="0",WATCHTOWER_SHADOW_EVALUATION_ENABLED="0",BIRDEYE_CREDENTIAL_LABEL="BIRDEYE"
autostart=false
autorestart=false
stdout_logfile=__LOG_ROOT__/watchtower_api.log
stderr_logfile=__LOG_ROOT__/watchtower_api_err.log

[program:operation_monitor_worker]
command=__PYTHON_BIN__ -m src.ops.operation_monitor_service
directory=__WATCHTOWER_ROOT__
environment=PYTHONPATH="__WATCHTOWER_ROOT__",WATCHTOWER_FINAL_SHA="__WATCHTOWER_FINAL_SHA__",WATCHTOWER_OFFSET_AUDIT_LEDGER_PATH="__WATCHTOWER_OFFSET_AUDIT_LEDGER_PATH__",DB_PATH="__CANONICAL_DB_PATH__",WT_OPS_DB_PATH="__OPERATIONS_DB_PATH__",OPERATION_MONITOR_QUEUE_PATH="__MONITOR_QUEUE_PATH__",OPERATIONS_MODE="MONITOR",WATCHTOWER_SHADOW_EVALUATION_ENABLED="0",BIRDEYE_CREDENTIAL_LABEL="BIRDEYE"
autostart=false
autorestart=false
stdout_logfile=__LOG_ROOT__/operation_monitor_worker.log
stderr_logfile=__LOG_ROOT__/operation_monitor_worker_err.log
